<script>const MD = "# Civilization 5 для новичков: сценарий ролика\n\nРолик на 11–12 минут для тех, кто только начал играть или проигрывает ИИ. Без лишней теории: как устроена игра, что делать в первые ходы и какие ошибки совершают почти все новички.\n\n## Концепция\n\nРолик продаёт одно обещание: после 12 минут зритель понимает, что делать на каждом этапе партии, и перестаёт проигрывать ИИ на средних уровнях сложности. Каждая сцена — одно правило, показанное на экране игры.\n\n**Длина:** 11–12 минут. Хватает для рекламы в середине и коротко, чтобы досматривали.\n\n**Аудитория:** купили Civ5 или вернулись к ней, сыграли пару партий, запутались в иконках и проиграли. Сетевые игроки, которым нужны основы.\n\n**Варианты названия:**\n\n1. Civilization 5 для новичков: всё, что нужно знать за 12 минут\n2. 7 ошибок, из-за которых ты проигрываешь в Civilization 5\n3. Как начать партию в Civ 5, чтобы не проиграть к 100-му ходу\n\n**Варианты превью (на картинке не больше 4 слов):**\n\n| № | Что на картинке | Текст |\n| --- | --- | --- |\n| 1 | Красный грустный смайлик счастья крупно на фоне горящего города | «НЕ ДЕЛАЙ ТАК» |\n| 2 | Экран победы + большая цифра «12 минут» | «CIV 5 С НУЛЯ» |\n| 3 | Карта с тремя городами, обведёнными зелёным, и стрелкой | «ПЕРВЫЕ 30 ХОДОВ» |\n\n**Крючок в первые 15 секунд:** сразу проблема и обещание, без приветствий и логотипов. Что держит удержание:\n\n- смена картинки каждые 3–5 секунд;\n- в каждой сцене одно правило и пример на экране;\n- «открытая петля»: в начале обещаем главную ошибку новичков и раскрываем её в конце, в сцене про ошибки.\n\n## Сценарий по сценам\n\n14 сцен, около 11,5 минуты. В каждой: что в кадре, текст за кадром (читать слово в слово), надпись на экране, монтаж и звук. Числа даны для обычной Civilization 5 с дополнением Brave New World на стандартной скорости.\n\n### Сцена 1 · 0:00–0:15 · Крючок\n\n- **В кадре:** город горит, всплывает «Вы потерпели поражение»; резкий переход на свою империю с красным смайликом недовольства.\n- **Текст за кадром:** «Civilization 5 выглядит сложной: десятки иконок, сотни кнопок. Но проигрывают новички почти всегда из-за нескольких простых ошибок. За двенадцать минут я покажу, как начинать партию, что строить и как побеждать. А главную ошибку новичков оставлю на конец — её делают почти все.»\n- **Надпись:** «CIV 5 ЗА 12 МИНУТ».\n- **Монтаж и звук:** без заставки; удар барабана на «поражение»; музыка нарастает.\n\n### Сцена 2 · 0:15–1:00 · Как здесь побеждают\n\n- **В кадре:** экран «Путь к победе», по очереди подсвечиваются пять типов побед.\n- **Текст за кадром:** «Побед пять. Военная — захватить все столицы соперников. Научная — построить и запустить космический корабль. Культурная — набрать столько туризма, чтобы ваша культура влияла на все другие цивилизации. Дипломатическая — победить в голосовании за мирового лидера. И победа по времени — лучший счёт к концу игры. Выбирать путь не нужно с первого хода: начало у всех одинаковое — сильная экономика. Её и строим.»\n- **Надпись:** пять иконок побед с подписями.\n- **Монтаж:** каждая победа — 3 секунды с роликом из игры.\n\n### Сцена 3 · 1:00–1:50 · Семь иконок, которые решают всё\n\n- **В кадре:** верхняя панель и экран города, иконки выделяются кружками по очереди.\n- **Текст за кадром:** «Еда растит город: больше жителей — больше обработанных клеток. Молотки — это производство, им строят здания и юнитов. Золото платит за содержание и покупки. Колбы — наука и новые технологии. Культура даёт политики и расширяет границы. Вера нужна для религии. А смайлик — счастье всей империи, и про него будет отдельный разговор. Запомните простое правило: город, который не растёт, не развивается.»\n- **Надпись:** семь иконок в ряд с короткими подписями.\n- **Монтаж:** звук щелчка на каждую иконку.\n\n### Сцена 4 · 1:50–2:50 · Где поставить столицу\n\n- **В кадре:** поселенец на старте, подсказка клеток, наведение на реку, холм, побережье, люкс.\n- **Текст за кадром:** «Первое решение — где поставить столицу. Не тратьте на поиск больше одного-двух ходов. Хорошее место: река или озеро рядом — больше еды и дешевле постройки; побережье — гавань и морская торговля; холм — город лучше защищён. И обязательно роскошь рядом: вино, шёлк, специи. Каждый новый вид роскоши даёт счастье всей империи.»\n- **Надпись:** «Река · побережье · холм · роскошь».\n- **Монтаж:** на каждом пункте — подсветка клетки на карте.\n\n### Сцена 5 · 2:50–3:50 · Первые 30 ходов\n\n- **В кадре:** очередь производства крупно, ускорение ×4: разведчик уходит в туман, находит руины, строится монумент, выходит поселенец.\n- **Текст за кадром:** «Проверенный порядок постройки: разведчик, монумент, поселенец, рабочий, ещё поселенец. Разведчик собирает руины — там бывают бесплатные технологии, золото и даже жители — и первым находит города-государства, за что они дают награду. Монумент даёт культуру и первую политику. А поселенцы — это ваши будущие города. В технологиях начните с гончарного дела, скотоводства и горного дела: они открывают амбар и улучшения клеток.»\n- **Надпись:** цепочка иконок «разведчик → монумент → поселенец → рабочий → поселенец».\n- **Монтаж:** иконки появляются по одной в такт словам.\n\n### Сцена 6 · 3:50–4:40 · Широко или высоко\n\n- **В кадре:** экран политик: Традиция и Воля рядом; две карты — империя из 4 крупных городов и из 8 мелких.\n- **Текст за кадром:** «Есть два стиля. Высокий — мало городов, но они большие: открывайте Традицию, она усиливает столицу и рост. Широкий — много городов: открывайте Волю, она ускоряет поселенцев и рабочих. Новичку проще начать с Традиции и трёх-четырёх городов. Помните: каждый новый город немного удорожает политики и технологии, зато даёт клетки, ресурсы и производство.»\n- **Надпись:** «Традиция = мало крупных городов · Воля = много городов».\n- **Монтаж:** сплит-скрин двух карт.\n\n### Сцена 7 · 4:40–5:30 · Рабочие и клетки\n\n- **В кадре:** рабочий строит ферму, шахту, плантацию на люксе, дорогу между городами.\n- **Текст за кадром:** «Город сам ничего не производит — производят клетки, на которых работают жители. Поэтому рабочие — самый недооценённый юнит. Держите примерно одного рабочего на город. Первым делом улучшайте роскошь и ресурсы рядом с городами: плантация на шелке, пастбище на коровах, шахта на железе. Соедините города дорогой со столицей — это торговый путь и золото каждый ход.»\n- **Надпись:** «1 рабочий на город»; «Сначала люксы и ресурсы».\n- **Монтаж:** таймлапс клеток до и после улучшения.\n\n### Сцена 8 · 5:30–6:30 · Счастье — тихий убийца\n\n- **В кадре:** смайлик счастья становится красным, подсказка со штрафами; город перестаёт расти.\n- **Текст за кадром:** «Счастье общее на всю империю. Каждый город и каждый житель его уменьшают, а роскошь, колизеи и храмы — повышают. Как только счастье ниже нуля, рост всех городов резко падает. Ниже минус десяти — города перестают расти совсем, нельзя строить поселенцев, а армия слабеет. Правило простое: прежде чем ставить новый город, проверьте, есть ли запас счастья. И подключайте каждую новую роскошь.»\n- **Надпись:** «Счастье < 0 → рост почти стоп»; «< −10 → нет поселенцев».\n- **Монтаж:** красная виньетка и низкий гул на «ниже нуля». Здесь (около 6:00) середина ролика: просьба подписаться, 5 секунд.\n\n### Сцена 9 · 6:30–7:20 · Города-государства\n\n- **В кадре:** экран города-государства, задание, подарок золотом, статус «союзник».\n- **Текст за кадром:** «Маленькие нейтральные города на карте — это города-государства. Выполняйте их задания: убить варваров, построить дорогу, найти чудо природы. За это растёт влияние. Друзья дают бонусы: еду, культуру, веру или науку. Союзники отдают свою роскошь и, главное, голоса на мировом конгрессе — именно они решают дипломатическую победу.»\n- **Надпись:** «Задания → влияние → союзник → голоса».\n- **Монтаж:** стрелки от города-государства к вашей столице с иконками бонусов.\n\n### Сцена 10 · 7:20–8:10 · Война: как не потерять армию\n\n- **В кадре:** подсказка исхода боя, лучники стреляют из-за мечников, фланговый удар, повышение юнита.\n- **Текст за кадром:** «В бою смотрите на подсказку исхода перед атакой — игра показывает, кто сколько потеряет. Лучники стреляют на две клетки и не получают ответного удара — ставьте их за спину пехоты. Холмы и лес дают защитнику плюс к силе, атака через реку — минус. Окружайте врага: каждый ваш соседний юнит даёт фланговый бонус. Раненых отводите лечиться и не забывайте брать повышения. Города штурмуйте осадными орудиями, а не одной пехотой.»\n- **Надпись:** «Лучники за пехотой · холм и лес = защита · фланг = бонус».\n- **Монтаж:** три мини-блока с номерами 1-2-3; звуки боя из игры.\n\n### Сцена 11 · 8:10–8:50 · Религия и чудеса\n\n- **В кадре:** выбор пантеона, основание религии великим пророком, постройка чуда света.\n- **Текст за кадром:** «Святилище даёт веру, а вера — пантеон, маленький бонус на всю игру. Великий пророк основывает религию с более сильными верованиями. Чудеса света сильные, но дорогие: не пытайтесь построить все — ИИ часто успевает раньше. Выбирайте одно-два чуда под свой стиль.»\n- **Надпись:** «Святилище → пантеон → религия»; «1–2 чуда, не все».\n- **Монтаж:** торжественная музыка чуда.\n\n### Сцена 12 · 8:50–10:00 · Семь ошибок новичков\n\n- **В кадре:** на каждую ошибку — короткий клип из игры и красный крестик.\n- **Текст за кадром:** «А теперь ошибки, которые делают почти все. Первая — слишком много юнитов: каждый стоит золото за ход. Вторая — строить все здания подряд: у зданий тоже содержание. Третья — забывать о рабочих. Четвёртая — игнорировать города-государства. Пятая — объявлять войну без армии и осадных орудий. Шестая — бездумно ставить города рядом с соседом. И седьмая, главная, — уйти в минус по счастью и даже не заметить: империя просто перестаёт расти.»\n- **Надпись:** счётчик ошибок 1–7, на седьмой — крупно «СЧАСТЬЕ».\n- **Монтаж:** кульминация; на седьмой ошибке — пауза и стоп-кадр.\n\n### Сцена 13 · 10:00–10:50 · Чек-лист на одном экране\n\n- **В кадре:** карточка с пунктами на фоне замедленной карты.\n- **Текст за кадром:** «Короткий чек-лист. Столица у реки или моря с роскошью. Разведчик, монумент, поселенцы. Три-четыре города и Традиция. Рабочий на каждый город. Счастье всегда выше нуля. Задания городов-государств. Армия с лучниками и осадой, а не толпа юнитов. Скриньте этот экран.»\n- **Надпись:** семь пунктов одной карточкой; в углу «скринь из ролика».\n- **Монтаж:** карточка висит не меньше 8 секунд.\n\n### Сцена 14 · 10:50–11:30 · Финал и призыв\n\n- **В кадре:** сетевое лобби, игроки, лаунчер Nova; конечная заставка с двумя роликами.\n- **Текст за кадром:** «Попробуйте этот план в своей следующей партии. А когда освоитесь против ИИ, заходите в сетевые игры: в описании ссылка на наш сервер Nova — с рейтингом, турнирами и живыми соперниками. Напишите в комментариях, какую ошибку вы делали чаще всего.»\n- **Надпись:** «Сервер Nova — ссылка в описании»; вопрос для комментариев крупно.\n- **Монтаж:** последние 20 секунд — конечная заставка YouTube с двумя роликами и кнопкой подписки.\n\n## Что записать в игре\n\nЗапись 1080p 60 кадров, интерфейс крупно (масштаб UI 125%). Всё снимается в одиночной партии против ИИ на стандартной скорости.\n\n- [ ] Поражение и горящий город; экран победы — сцена 1\n- [ ] Экран «Путь к победе» и короткие ролики каждого типа победы — сцена 2\n- [ ] Верхняя панель и экран города с иконками выдачи — сцена 3\n- [ ] Поселенец на старте: река, холм, побережье, люкс рядом — сцена 4\n- [ ] Первые 30 ходов: разведчик, руины, монумент, поселенцы — сцена 5\n- [ ] Экран политик (Традиция, Воля); карта из 4 и из 8 городов — сцена 6\n- [ ] Рабочие строят ферму, шахту, плантацию, дорогу — сцена 7\n- [ ] Счастье уходит в минус, подсказка со штрафами — сцена 8\n- [ ] Экран города-государства, задание, подарок, статус союзника — сцена 9\n- [ ] Бой с подсказкой исхода, лучники за пехотой, фланг, повышение, осада города — сцена 10\n- [ ] Выбор пантеона, основание религии, постройка чуда — сцена 11\n- [ ] Короткие клипы на каждую из семи ошибок — сцена 12\n- [ ] Сетевое лобби и лаунчер Nova — сцена 14\n- [ ] Фоновые пролёты над картой по 10 секунд — 6–8 штук\n\n## Упаковка для YouTube\n\n**Описание (первые две строки видны без «ещё»):**\n\n```\nВсё, что нужно знать новичку в Civilization 5, за 12 минут: как побеждать, где ставить столицу, что строить в первые 30 ходов и какие 7 ошибок делают почти все.\nПростой чек-лист, который можно применить уже в следующей партии.\n\nСетевые партии, рейтинг и турниры — сервер Nova: https://coddysmon.github.io/TournamentModPack\nDiscord: [ссылка]\n```\n\n**Главы (вставить в описание как есть):**\n\n```\n0:00 Civ 5 за 12 минут\n0:15 Как здесь побеждают\n1:00 Семь иконок\n1:50 Где поставить столицу\n2:50 Первые 30 ходов\n3:50 Широко или высоко\n4:40 Рабочие и клетки\n5:30 Счастье\n6:30 Города-государства\n7:20 Война\n8:10 Религия и чудеса\n8:50 Семь ошибок новичков\n10:00 Чек-лист\n10:50 Что дальше\n```\n\n**Теги:** civilization 5, civ 5 гайд, civ 5 для новичков, как играть в цивилизацию 5, цивилизация 5 гайд для начинающих, civ 5 первые ходы, civ 5 ошибки, civ 5 счастье, civ 5 стратегия, civilization v.\n\n**Закреплённый комментарий:**\n\n```\nКакую из 7 ошибок вы делали чаще всего? 1 — много юнитов, 2 — все здания подряд, 3 — мало рабочих, 4 — без городов-государств, 5 — война без осады, 6 — города впритык к соседу, 7 — минус по счастью. Пишите цифру 👇\n```\n\n**Shorts из ролика** (вертикально, 30–45 секунд, ссылка на ролик как «связанное видео»):\n\n| Short | Из сцены | Первая фраза |\n| --- | --- | --- |\n| Где поставить столицу | 4 | «Не ищите идеальное место больше двух ходов» |\n| Счастье ниже нуля | 8 | «Вот почему ваша империя вдруг перестала расти» |\n| Лучники за пехотой | 10 | «Этот юнит бьёт и не получает сдачи» |\n| Главная ошибка новичков | 12 | «Её делают почти все в первой же партии» |\n\n**Что ещё работает на просмотры:** выкладывать в четверг–пятницу вечером по МСК; в первый час отвечать на комментарии; через неделю сравнить удержание по сценам в YouTube Studio и при низком CTR поменять превью на другой вариант.\n\n## Готовый промт\n\nДва промта. Первый — для текстовой нейросети, если нужен другой вариант сценария или ролик другой длины. Второй — для видеонейросети (Veo, Sora, Kling), только для заставок и переходов: настоящий геймплей Civ5 нейросеть правдоподобно не нарисует, его записывают с экрана.\n\n**Промт 1 — сценарий по сценам:**\n\n```\nТы — сценарист игрового YouTube-канала. Напиши сценарий ролика-гайда «Civilization 5 для новичков» длиной 11–12 минут, цель — максимум просмотров и удержания у новичков.\n\nФормат ответа: 12–15 сцен. Для каждой сцены: таймкод, название, «В кадре» (что записать в игре, ракурс, интерфейс), «Текст за кадром» (дословно, разговорный русский, короткие фразы), «Надпись на экране» (не больше 6 слов), «Монтаж и звук». В конце — 3 названия, 3 идеи превью (до 4 слов на картинке), главы для описания, теги, закреплённый комментарий с вопросом, 4 идеи Shorts.\n\nТемы по порядку: пять типов побед; семь иконок выдачи (еда, молотки, золото, наука, культура, вера, счастье); где ставить столицу (река, побережье, холм, роскошь); первые 30 ходов (разведчик, монумент, поселенец, рабочий, поселенец; руины; первые технологии); Традиция против Воли (мало крупных городов против многих); рабочие и улучшения клеток, дороги между городами; счастье (ниже нуля — рост резко падает, ниже −10 — нет роста и поселенцев, армия слабеет); города-государства (задания, друзья, союзники, голоса на конгрессе); бой (подсказка исхода, лучники за пехотой, местность, фланг, повышения, осада городов); религия и чудеса (не строить все чудеса); семь ошибок новичков (много юнитов, все здания подряд, мало рабочих, игнор городов-государств, война без осады, города впритык к соседу, минус по счастью — главная); чек-лист на одном экране; финал с приглашением в сетевые игры на сервере Nova.\n\nПравила: первые 15 секунд — проблема и обещание, без приветствий; в каждой сцене одно правило и пример на экране; в начале пообещать «главную ошибку новичков» и раскрыть её ближе к концу; призыв подписаться только в середине и не дольше 5 секунд; числа — только для обычной Civilization 5 с Brave New World, не выдумывать статистику и проценты.\n```\n\n**Промт 2 — заставка и переходы для видеонейросети (на английском, так они понимают лучше):**\n\n```\nCinematic 8-second shot, top-down camera slowly descending over a hand-painted strategy-game world map at dawn: hex tiles, rivers, forests, a small ancient city with stone walls glowing gold, tiny banners of rival empires at the edges. Warm golden light, soft fog, painterly style like a historical board game, no text, no UI, no real logos. Ends on a close-up of the glowing city.\n```\n\n```\nCinematic 5-second transition: a parchment map of hexagonal territories rolls open on a wooden table, ink lines of borders draw themselves, three new city markers appear one after another. Candlelight, shallow depth of field, no text, no logos.\n```\n";</script>
