<script>const MD = "# Видео-гайд Civ5: сценарий\n\nРолик на 10–12 минут по данным сервера Nova: как играет игрок, который выигрывает 60% доигранных партий, и чему у него научиться новичку.\n\n## Концепция\n\nРолик продаёт одно обещание: зритель узнает схему игрока, который выигрывает втрое чаще остальных, и повторит её в своей следующей партии. Все цифры взяты из журналов сервера Nova за 16.09–19.10.2026 (26 партий игрока, 817 игрок-партий для сравнения) — это и есть отличие от сотен обычных гайдов.\n\n**Длина:** 10–12 минут. Достаточно для рекламы в середине ролика и коротко, чтобы досматривали.\n\n**Аудитория:** играли в Civ5 против ИИ, хотят в сетевые партии или проигрывают там. Основы игры знают, но не понимают, почему отстают.\n\n**Варианты названия:**\n\n1. Лучший игрок сервера выигрывает 60% партий. Я разобрал его игру | Civilization 5\n2. 26 партий топ-игрока под микроскопом: как на самом деле побеждают в Civ 5\n3. Ты проигрываешь в Civ 5 на 30-м ходу. Вот почему\n\n**Варианты превью (на картинке не больше 4 слов):**\n\n| № | Что на картинке | Текст |\n| --- | --- | --- |\n| 1 | Две карты рядом на 30-м ходу: слева 1 город, справа 3 города, красная и зелёная рамка | «ТЫ vs ТОП-1» |\n| 2 | График счёта, одна линия уходит вверх, стрелка | «60% ПОБЕД» |\n| 3 | Экран победы + лицо автора с удивлением или рука с лупой | «РАЗОБРАЛ ЕГО ИГРУ» |\n\n**Крючок в первые 15 секунд:** сразу цифра и обещание, без приветствий и логотипов. Что держит удержание дальше:\n\n- смена картинки каждые 3–5 секунд (геймплей, цифра на экране, сравнение «он / средний игрок»);\n- в каждой сцене одна цифра и один совет;\n- «открытая петля» в начале: самый неожиданный факт обещаем в конце (какой победой выигрывается 67% партий).\n\nНик игрока (Achilles) и его цифры — только с его согласия. Без согласия говорим «топ-1 сервера по числу побед».\n\n## Сценарий по сценам\n\n14 сцен, около 11 минут. В каждой: что в кадре, текст за кадром (читать слово в слово), надпись на экране, монтаж и звук. Числа с пометкой «Nova» — правила нашего мода, в обычной Civ5 они другие; так и говорим в ролике.\n\n### Сцена 1 · 0:00–0:15 · Крючок\n\n- **В кадре:** экран победы, резкий переход на таблицу рейтинга, зум на строку топ-игрока.\n- **Текст за кадром:** «В партии на шестерых случайный игрок выигрывает в одной партии из шести. Этот игрок выиграл девять из пятнадцати. Я разобрал двадцать шесть его партий по ходам — и дело вообще не в том, что вы думаете.»\n- **Надпись:** «9 из 15» крупно, под ней «случайный игрок: 1 из 6».\n- **Монтаж и звук:** без заставки; удар барабана на цифре; музыка нарастает.\n\n### Сцена 2 · 0:15–0:40 · Откуда цифры\n\n- **В кадре:** сайт со статистикой и картой повтора партии (движущиеся юниты).\n- **Текст за кадром:** «Наш сервер записывает каждую сетевую партию: что построено, когда, сколько золота и науки на каждом ходу. Я взял двадцать шесть партий лучшего игрока и сравнил с восемьюстами партиями обычных игроков. Это не мнение, это цифры. И в конце будет факт, который меняет всю стратегию.»\n- **Надпись:** «26 партий · 2857 ходов · 817 соперников».\n- **Монтаж:** быстрая нарезка таблиц и карты; на «факт в конце» — вопросительный знак в углу.\n\n### Сцена 3 · 0:40–1:40 · Дебют по шаблону\n\n- **В кадре:** начало партии в ускорении ×4: столица ставится на 1-м ходу, очередь производства крупно.\n- **Текст за кадром:** «Он строит одно и то же почти в каждой партии. Разведчик. Ещё разведчик. Монумент. Рабочий. И три поселенца подряд. Монумент третьей постройкой — в двух партиях из трёх; у остальных игроков — в каждой третьей. Зачем? Первая политика уже на одиннадцатом ходу. А святилище и пантеон подождут.»\n- **Надпись:** цепочка иконок «разведчик → разведчик → монумент → рабочий → поселенец ×3», потом «монумент 3-м: 64% / 30%».\n- **Монтаж:** иконки появляются по одной в такт словам; звук клика интерфейса.\n\n### Сцена 4 · 1:40–2:30 · Три города к 30-му ходу\n\n- **В кадре:** сплит-скрин: слева типичная империя на 30-м ходу (2 города), справа его (3 города).\n- **Текст за кадром:** «Второй город — на двадцать втором ходу, третий — на двадцать седьмом. К тридцатому ходу у него три города, у среднего игрока — два. И вот что интересно: места для городов он выбирает не лучше других. Он просто ставит их раньше. Не ищите идеальную клетку — хорошая клетка сейчас лучше идеальной через пять ходов.»\n- **Надпись:** «Ход 30: 3 города vs 2».\n- **Монтаж:** на фразе про клетку — пауза на полсекунды и повтор фразы надписью (это просится в Shorts).\n\n### Сцена 5 · 2:30–3:20 · Рабочие и лес\n\n- **В кадре:** рабочий рубит лес, цифра молотков взлетает в городе; покупка клетки с люксом.\n- **Текст за кадром:** «К пятидесятому ходу у него девять-десять рабочих. У среднего игрока шесть. Он вырубает вдвое больше леса — это бесплатные молотки в дебюте. И вдвое больше золота тратит на покупку клеток. Итог: к семьдесят пятому ходу производство у него на треть выше, чем у соперников в тех же партиях.»\n- **Надпись:** «Рабочих к 50-му ходу: 9–10 / 6», потом «Производство ×1,37».\n- **Монтаж:** звук топора на вырубке; столбики «он / средний» растут анимацией.\n\n### Сцена 6 · 3:20–4:10 · Счастье — тихий убийца\n\n- **В кадре:** верхняя панель, смайлик счастья становится красным; подсказка со штрафами.\n- **Текст за кадром:** «Самая частая ошибка новичка — уйти в минус по счастью. В Nova штраф начинается уже с минус одного: рост падает на семьдесят пять процентов, а производство, золото и сила армии теряют по два процента за каждую единицу. Лучший игрок держит запас плюс двадцать пять к сотому ходу. Средний — плюс десять. Именно этот запас потом позволяет ему захватывать чужие города без штрафов.»\n- **Надпись:** «−1 счастья = рост −75% (Nova)»; «Запас к 100-му ходу: +25 / +10».\n- **Монтаж:** на «минус одного» — красная виньетка и низкий гул.\n\n### Сцена 7 · 4:10–5:00 · Странный выбор: Честь\n\n- **В кадре:** экран политик, курсор обходит Традицию и Волю и нажимает Честь; разведчик находит лагерь варваров.\n- **Текст за кадром:** «А вот что удивило меня больше всего. Почти все начинают с Традиции или Воли. Он в половине партий берёт Честь — ветку для войны. Плюс тридцать три процента к бою с варварами и видно, где появляются их лагеря. Он убивает тридцать варваров за партию, средний игрок — двенадцать. Это опыт для армии, золото с лагерей и задания городов-государств.»\n- **Надпись:** «Честь первой: 54% / 16%»; «Варваров за партию: 30 / 12».\n- **Монтаж:** после слов «удивило больше всего» — стоп-кадр на секунду. Здесь же (около 4:30) середина ролика: короткая просьба подписаться (5 секунд, не длиннее).\n\n### Сцена 8 · 5:00–5:50 · Войну объявят тебе\n\n- **В кадре:** всплывающее окно «вам объявили войну», вражеские юниты у границы, стены и лучники в городе.\n- **Текст за кадром:** «Сильному игроку объявляют войну раньше всех — в среднем на шестьдесят четвёртом ходу. А сам он начинает войну позже, на семьдесят шестом. И ещё одно: в Nova на быстрой скорости мир между людьми держится один ход. Мирный договор — не защита. К пятидесятому ходу держите два-четыре боевых юнита и стены в пограничных городах.»\n- **Надпись:** «Ему объявляют: ход 64 · он объявляет: ход 76»; «Мир = 1 ход (Nova)».\n- **Монтаж:** тревожная музыка; на «не защита» — звук разрываемого пергамента.\n\n### Сцена 9 · 5:50–7:00 · Армия, которая не умирает\n\n- **В кадре:** бой с подсказкой исхода, фланговый удар, повышение юнита, апгрейд за золото.\n- **Текст за кадром:** «Он убивает сорок семь юнитов врагов за партию и теряет двадцать семь. Средний игрок — наоборот: убивает одиннадцать, теряет шестнадцать. Секрет тройной. Первое — повышения сразу: он нажимает их в пять раз чаще. Второе — апгрейд вместо новой армии: сорок шесть апгрейдов за партию против тринадцати. Третье — счёт. В Nova в бою нет случайности: равные юниты всегда наносят друг другу двадцать девять урона. Фланг — плюс десять процентов за каждого соседа. Атакуйте, только когда счёт в вашу пользу.»\n- **Надпись:** «Убил / потерял: 47 / 27 против 11 / 16»; табличка урона «1:1 → 29/29 · 2:1 → 17/51 · 3:1 → 9/90».\n- **Монтаж:** разделить на три мини-блока с номерами 1-2-3 на экране; звуки боя из игры.\n\n### Сцена 10 · 7:00–7:40 · Чудеса молотками\n\n- **В кадре:** ролики постройки чудес (Бранденбургские ворота, Химэдзи, Великая стена) по 2 секунды.\n- **Текст за кадром:** «Куда уходят все эти молотки? В чудеса. Четырнадцать чудес за партию против семи у среднего игрока. И строит он их производством, а не покупкой. Золото выгоднее тратить на дорогое: тридцать молотков стоят сто шестьдесят четыре золота, а триста — всего девятьсот двадцать четыре.»\n- **Надпись:** «Чудес: 14 / 7»; «30 молотков = 164 золота · 300 = 924».\n- **Монтаж:** торжественная музыка чудес из игры, быстрая смена картинок.\n\n### Сцена 11 · 7:40–8:20 · Темп и демография\n\n- **В кадре:** запись экрана с курсором: быстрый ход, открытие демографии, заход в экран города.\n- **Текст за кадром:** «Он не думает дольше других — он успевает больше. Двадцать семь действий за ход против девятнадцати. И почти каждый ход открывает демографию: где отстаёшь — туда и вкладываешь следующие десять ходов.»\n- **Надпись:** «27 действий за ход / 19»; «Демография: каждый ход».\n- **Монтаж:** ускорение ×2 с подсветкой каждого клика кружком.\n\n### Сцена 12 · 8:20–9:40 · Факт, который меняет всё\n\n- **В кадре:** круговая диаграмма типов побед; Всемирный конгресс, голосование; задания городов-государств.\n- **Текст за кадром:** «И вот обещанный факт. Две трети всех доигранных партий на сервере заканчиваются не войной и не космосом, а дипломатической победой. И наш игрок выиграл так пять партий из девяти. Как? Он выполняет задания городов-государств — восемнадцать за партию, у среднего игрока двенадцать. И копит золото: к сто двадцать пятому ходу у него около четырёх тысяч в казне, у среднего — тысяча восемьсот. Когда приходит время голосования, эти деньги превращаются в союзников и голоса.»\n- **Надпись:** «Дипломатия: 67% всех побед»; «Заданий ГГ: 18 / 12»; «Золото на 125-м ходу: ~4000 / 1800».\n- **Монтаж:** кульминация ролика; диаграмма собирается по секторам; звук стука молотка судьи на «67%».\n\n### Сцена 13 · 9:40–10:30 · Пять правил на одном экране\n\n- **В кадре:** список из пяти пунктов на фоне замедленной карты.\n- **Текст за кадром:** «Итак, пять правил. Три города к тридцатому ходу. Рабочих много и лес на молотки. Счастье никогда ниже нуля. Армию повышать и обновлять, а не строить заново. И копить золото к Конгрессу. Скриньте этот экран.»\n- **Надпись:** пять пунктов одной карточкой; в углу «скринь из ролика».\n- **Монтаж:** карточка висит не меньше 8 секунд — её ставят на паузу и перематывают, это повышает удержание.\n\n### Сцена 14 · 10:30–11:10 · Финал и призыв\n\n- **В кадре:** лаунчер Nova, лобби с игроками, таблица рейтинга; заключительный экран с двумя роликами.\n- **Текст за кадром:** «Все эти цифры — из настоящих партий на сервере Nova. Хотите проверить схему на живых соперниках — ссылка на лаунчер и Discord в описании, там же рейтинг и повторы партий. А в комментариях напишите, какой пункт вы нарушаете чаще всего. Я ставлю на счастье.»\n- **Надпись:** «Nova — ссылка в описании»; вопрос для комментариев крупно.\n- **Монтаж:** последние 20 секунд — конечная заставка YouTube с двумя роликами и кнопкой подписки.\n\n## Что записать в игре\n\nЗапись 1080p 60 кадров, интерфейс крупно (масштаб UI 125%), без чужих ников в кадре без согласия. Всё можно снять в одиночной партии на быстрой скорости с модом Nova.\n\n- [ ] Экран победы (любой тип) — сцена 1\n- [ ] Таблица рейтинга и карта повтора с сайта — сцены 1–2\n- [ ] Первые 30 ходов по шаблону: разведчик, разведчик, монумент, рабочий, три поселенца — сцена 3\n- [ ] Империя на 30-м ходу: вариант «2 города» и вариант «3 города», один ракурс камеры — сцена 4\n- [ ] Вырубка леса с всплывающей цифрой молотков, покупка клетки с люксом — сцена 5\n- [ ] Счастье уходит в минус + подсказка со штрафами — сцена 6\n- [ ] Экран политик, выбор Чести; лагерь варваров и бой с ним — сцена 7\n- [ ] Окно объявления войны, враг у границы, город со стенами — сцена 8\n- [ ] Бой с подсказкой исхода, фланг, повышение, апгрейд — сцена 9\n- [ ] Ролики чудес: Бранденбургские ворота, Химэдзи, Великая стена; окно покупки с ценой — сцена 10\n- [ ] Быстрый ход с видимым курсором, открытие демографии — сцена 11\n- [ ] Всемирный конгресс, задания городов-государств, подарок золотом — сцена 12\n- [ ] Лаунчер Nova и лобби — сцена 14\n- [ ] Фоновые пролёты над картой по 10 секунд (для подложки под надписи) — 6–8 штук\n\nГрафики и столбики сравнения делаются в монтаже; числа для них — в надписях сцен.\n\n## Упаковка для YouTube\n\n**Описание (первые две строки видны без «ещё»):**\n\n```\nЛучший игрок сервера выиграл 9 из 15 сетевых партий в Civilization 5. Я разобрал 26 его партий по ходам и сравнил с 800 партиями обычных игроков.\nПять правил, которые можно применить уже в следующей партии.\n\nИграть с нами (лаунчер Nova, рейтинг, повторы партий): https://coddysmon.github.io/TournamentModPack\nDiscord: [ссылка]\n\nПравила с пометкой Nova — особенности нашего мода, в обычной Civ5 числа другие.\n```\n\n**Главы (вставить в описание как есть):**\n\n```\n0:00 9 побед из 15\n0:15 Откуда цифры\n0:40 Дебют по шаблону\n1:40 Три города к 30-му ходу\n2:30 Рабочие и лес\n3:20 Счастье — тихий убийца\n4:10 Странный выбор: Честь\n5:00 Войну объявят тебе\n5:50 Армия, которая не умирает\n7:00 Чудеса молотками\n7:40 Темп и демография\n8:20 Факт, который меняет всё\n9:40 Пять правил\n10:30 Играть с нами\n```\n\n**Теги:** civilization 5, civ 5 гайд, как играть в цивилизацию 5, civ 5 для новичков, civ 5 мультиплеер, civ 5 стратегия, цивилизация 5 советы, civ 5 дипломатическая победа, civ 5 первые ходы, nova civ 5.\n\n**Закреплённый комментарий:**\n\n```\nКакое из пяти правил вы нарушаете чаще всего? 1 — три города к 30-му ходу, 2 — рабочие, 3 — счастье, 4 — армия, 5 — золото к Конгрессу. Пишите цифру 👇\n```\n\n**Shorts из ролика** (вертикально, 30–45 секунд, ссылка на ролик как «связанное видео»):\n\n| Short | Из сцены | Первая фраза |\n| --- | --- | --- |\n| Три города к 30-му ходу | 4 | «Хорошая клетка сейчас лучше идеальной через пять ходов» |\n| Минус одно счастье | 6 | «Одна единица недовольства — и рост падает на 75%» |\n| Бой без случайности | 9 | «Равные юниты всегда наносят ровно 29 урона» |\n| 67% побед — дипломатия | 12 | «Две трети партий выигрывают не войной» |\n\n**Что ещё работает на просмотры:** выкладывать в четверг–пятницу вечером по МСК; в первый час отвечать на комментарии; через неделю сравнить удержание по сценам в YouTube Studio и при низком CTR поменять превью на другой вариант из концепции.\n\n## Готовый промт\n\nДва промта. Первый — для текстовой нейросети, если нужен другой вариант сценария или ролик другой длины. Второй — для видеонейросети (Veo, Sora, Kling), только для заставок и переходов: настоящий геймплей Civ5 нейросеть правдоподобно не нарисует, его записывают с экрана.\n\n**Промт 1 — сценарий по сценам:**\n\n```\nТы — сценарист игрового YouTube-канала. Напиши сценарий ролика-гайда по Civilization 5 (мод Nova) длиной 10–12 минут, цель — максимум просмотров и удержания.\n\nФормат ответа: 12–15 сцен. Для каждой сцены: таймкод, название, «В кадре» (что записать в игре, ракурс, интерфейс), «Текст за кадром» (дословно, разговорный русский, короткие фразы), «Надпись на экране» (не больше 6 слов, с цифрой), «Монтаж и звук». В конце — 3 названия, 3 идеи превью (до 4 слов на картинке), главы для описания, закреплённый комментарий с вопросом, 4 идеи Shorts.\n\nПравила: первые 15 секунд — цифра и обещание, без приветствий; в каждой сцене одна цифра и один совет; в начале открыть интригу и закрыть её в конце; призыв подписаться только в середине и не дольше 5 секунд; правила мода помечать «(Nova)», они отличаются от обычной Civ5; не выдумывать чисел — только факты ниже.\n\nФакты (журналы сервера Nova, 16.09–19.10.2026; 26 партий топ-игрока, 817 игрок-партий для сравнения):\n- топ-игрок: 9 побед из 15 доигранных партий; случайный игрок в партии на шестерых — 1 из 6;\n- дебют: разведчик, разведчик, монумент, рабочий, 3 поселенца; монумент третьей постройкой в 64% партий против 30% у остальных; первая политика на 11-м ходу;\n- 2-й город на 22-м ходу, 3-й на 27-м; к 30-му ходу 3 города против 2; места для городов он выбирает не лучше других, а ставит раньше;\n- к 50-му ходу 9–10 рабочих против 6; вырубает вдвое больше леса; вдвое больше тратит на покупку клеток; производство ×1,37 к соперникам на 75-м ходу, золото ×1,38;\n- счастье (Nova): штраф уже с −1 — рост −75%, производство, золото и сила армии −2% за каждую единицу; его запас +25 к 100-му ходу против +10;\n- первой берёт Честь в 54% партий против 16%; убивает 30 варваров за партию против 12;\n- войну ему объявляют в среднем на 64-м ходу, сам он объявляет на 76-м; мир между людьми на быстрой скорости держится 1 ход (Nova);\n- убил/потерял юнитов: 47/27, у среднего игрока 11/16; апгрейдов 46 против 13; повышения нажимает в 5 раз чаще;\n- бой без случайности (Nova): 1:1 → 29/29 урона, 2:1 → 17/51, 3:1 → 9/90; фланг +10% за каждого соседа;\n- 14 чудес за партию против 7; 30 молотков стоят 164 золота, 300 — 924;\n- 27 действий за ход против 19, демографию открывает каждый ход;\n- 67% доигранных партий на сервере заканчиваются дипломатической победой; он выиграл так 5 из 9; заданий городов-государств 18 против 12; золота на 125-м ходу ~4000 против 1800.\n\nФинал: пять правил на одном экране и приглашение играть на сервере Nova (лаунчер и Discord в описании).\n```\n\n**Промт 2 — заставка и переходы для видеонейросети (на английском, так они понимают лучше):**\n\n```\nCinematic 8-second shot, top-down camera slowly descending over a hand-painted strategy-game world map at dawn: hex tiles, rivers, forests, a small ancient city with stone walls glowing gold, tiny banners of six rival empires at the edges. Warm golden light, soft fog, painterly style like a historical board game, no text, no UI, no real logos. Ends on a close-up of the glowing city.\n`
