<script>const EMBED = {"gaid": "# Гайд новичка Nova — черновик\n\n> **Черновик для владельца.** Не публиковать без «да». Опирается на два разбора:\n> - [ahilles-patterny.md](ahilles-patterny.md) — как играет Ахиллес, 3-е место рейтинга и 9\n>   побед из 15 доигранных партий, по журналам 26 его партий;\n> - [osnovy-mehanik.md](osnovy-mehanik.md) — правила игры с числами мода.\n>\n> Пометка «(Ахиллес)» значит, что совет взят из его игры, «(мех.)» — из правил мода.\n> Числа даны для **Быстрой** скорости: на ней идут партии рейтинга.\n\n## Коротко: пять правил\n\n1. **Три города к 30-му ходу.** Строй так: разведчик, разведчик, монумент, рабочий,\n   поселенцы. (Ахиллес)\n2. **Счастье не опускай ниже нуля.** Уже с −1 рост падает на 75%, а производство, золото и\n   сила армии теряют по 2% за каждую единицу минуса. (мех.)\n3. **Рабочих много.** Вырубай лес, покупай клетки. (Ахиллес)\n4. **Армию береги.** Повышай юнитов, обновляй их апгрейдами, бей без случайности\n   и с флангов. (Ахиллес + мех.)\n5. **Две трети партий кончаются дипломатической победой.** Копи золото и выполняй задания\n   городов-государств к Всемирному конгрессу. (данные сервера)\n\n---\n\n## 1. Первые 30 ходов\n\n### Ход 0: где ставить столицу\n\n- Не трать первые ходы на поиск идеального места. Река или море рядом — плюс: у Ахиллеса\n  3 столицы из 4 стоят у реки (у соперников 64%). Места городов он выбирает не лучше\n  других, зато ставит их раньше. (Ахиллес)\n- У реки и озера ферма даёт +1 еду раньше: с Гражданской службы. (мех. §10)\n- Город на холме получает +5 к силе обороны (мех. §13). Ахиллес ради холма столицу не\n  двигает: на холме стоит только каждая четвёртая его столица.\n\n### Порядок постройки\n\nАхиллес строит почти одинаково во всех партиях:\n\n| Ход | Что | Зачем |\n|---|---|---|\n| 1–3 | **Разведчик** | Руины, города-государства, места для городов. Руины в моде дают **еду** ближайшему городу (около 13 на Быстрой), а не жителя (мех. §1) |\n| 4–6 | **Разведчик** | То же. Позже оба разведчика охотятся на варваров и находят их лагеря |\n| 7–10 | **Монумент** | Культура → первая политика уже на 11-м ходу. У Ахиллеса монумент — третья постройка в 64% партий, у остальных — в 30% |\n| 11–14 | **Рабочий** | Из всех ранних покупок за золото Ахиллес чаще всего берёт рабочих |\n| 15–30 | **Поселенец ×3** | 2-й город около 22-го хода, 3-й около 27-го, 4-й около 33-го |\n| дальше | Святилище, амбар, лучник | Пантеон подождёт: Ахиллес берёт его на 32-м ходу, позже других |\n\n### Технологии в начале\n\n**Добыча → Гончарное дело → Скотоводство → Календарь / Охота → Бронза.**\n- Добычу Ахиллес берёт первой почти всегда: шахты и вырубка леса дают молотки.\n- Бронзу — на 36-м ходу, на 8 ходов раньше среднего игрока.\n- У моря: **Мореплавание → Оптика**.\n\n### Первая политика\n\n- Большинство открывает **Традицией** (35%) или **Волей** (20%).\n- Ахиллес в половине партий начинает **Честью**:\n  - +33% к бою с варварами;\n  - видно, где появляются их лагеря;\n  - позже Профессиональная армия: по тексту подсказки апгрейды на треть дешевле\n    (в базе мода это не подтверждено).\n- Новичку подойдёт любая из трёх. Главное — взять первую политику около 11-го хода.\n- Каждый новый город удорожает политики на 10% (мех. §5). Это не повод не строить города,\n  все сильные игроки строят 5–6.\n\n### Рабочие и клетки\n\n- К 50-му ходу держи **8–10 рабочих** (у Ахиллеса 9–10, у среднего игрока 6).\n- **Вырубай лес** на клетках, где он мешает: в дебюте это бесплатные молотки. Ахиллес к\n  50-му ходу вырубает вдвое больше среднего.\n- **Покупай клетки** с люксами и ресурсами. Клетка с ресурсом стоит базовую цену, как бы\n  далеко от города она ни была (мех. §3).\n\n### Счастье с первых ходов\n\n- **Старт — 9 счастья** (на сложностях Князь и выше; на Поселенце 15).\n  - Каждый **новый вид** люкса даёт +4. Исключения мода: вино, пиво, коньяк — 5; рис,\n    картофель, ячмень — 3; мускат, гвоздика, перец — 2.\n  - Вторая копия того же люкса **не даёт ничего**: лишнее меняй соседям.\n  - Город стоит 3 недовольства, житель — 1. (мех. §6)\n- **Держи счастье выше нуля всегда.** Ахиллес держит запас +8 к 50-му ходу и +25 к\n  100-му; средний игрок — +6 и +10.\n\n---\n\n## 2. Как не проиграть войну\n\n### Тебе объявят войну раньше, чем ты думаешь\n\n- Первая война между людьми — в среднем около **63-го хода**.\n- Ахиллесу объявляют в среднем на **64-м**, а сам он начинает на **76-м**.\n- **Мир на Быстрой держится 1 ход** (в ванили 10): его можно разорвать сразу.\n  Мирный договор — не защита. (мех. §13)\n\n### Что держать к 50–60-му ходу\n\n- **2–4 боевых юнита и стены** в пограничных городах.\n- Город стреляет на 2 клетки, у него 200 здоровья, и он лечит 20 в ход. Стены дают +5 к\n  силе, а в выстреле не участвуют. (мех. §13)\n- Лучники хороши в обороне: обстрелянный юнит **не отвечает**. (мех. §13)\n\n### Бой без случайности — считай заранее\n\n| Отношение сил | Урон сильному | Урон слабому |\n|---|---|---|\n| 1 : 1 | 29 | 29 |\n| 1,5 : 1 | 23 | 39 |\n| 2 : 1 | 17 | 51 |\n| 3 : 1 | 9 | 90 |\n\n(мех. §13)\n\n| Что | Как влияет на силу |\n|---|---|\n| **Фланг** | +10% за каждый твой боевой юнит рядом с целью |\n| **Холм или лес** у защитника | +25%; лес на холме — тоже +25% |\n| **Атака через реку** | −20% |\n| **Высадка с воды** | −50% |\n| **Укрепление** | +20% за ход, до +40% |\n| **Счастье ниже нуля** | −2% силы за каждую единицу минуса, до −40%. **Не воюй в минусе по счастью** |\n\n- Раненый юнит в защите не слабеет: добивать его дорого. Своих раненых лучше уводить.\n- Повышение «Исцеление» лечит всего 10 (в ванили 50). Раненых уводи лечиться: в городе\n  25 в ход, на своей земле 20. (мех. §13)\n\n### Береги армию, как Ахиллес\n\n- **Повышения бери сразу.** Он жмёт повышение вручную около 107 раз за 100 ходов, средний\n  игрок — 21 раз.\n- **Муштра не хуже Натиска.** Ахиллес берёт Муштру I даже на 30% чаще, чем Натиск I, а у\n  остальных она в 1,5 раза реже Натиска.\n- **Апгрейд вместо новой армии:** у него 46 апгрейдов за партию против 13.\n- **Размен в твою пользу.** Ахиллес убивает 47 юнитов держав и теряет 27. Средний игрок\n  убивает 11, а теряет 16. Атакуй, только когда урон по таблице выше в твою пользу.\n- **Охоться на варваров.** Ахиллес убивает 30 варваров за партию, средний игрок — 12. Это\n  опыт, золото с лагерей и задания городов-государств.\n\n### Зона контроля\n\nЧерез клетку рядом с вражеским боевым юнитом нельзя пройти дальше: переход съедает весь ход.\nТак держится линия фронта (мех. §13; в моде правило не перепроверено).\n\n---\n\n## 3. Как побеждать\n\n### Чем кончаются партии на сервере\n\nДоиграно 83 партии:\n\n| Победа | Доля |\n|---|---|\n| **Дипломатическая** | **67%** |\n| Научная | 14% |\n| Военная | 8% |\n| Культурная | 7% |\n| Присуждена решением (`VICTORY_AWARD`) | 2% |\n\nМедиана конца партии — **131-й ход**. Партии, свёрнутые голосованием («Скрап»), победой\nне считаются и в рейтинг не идут.\n\n### Откуда берётся отрыв\n\n**Число технологий** у победителей почти такое же, как у всех. Самый ранний отрыв\nАхиллеса — в производстве и золоте. Наука в ход у него тоже выше, но позже, к 100-му ходу.\nОн опережает соперников в своих партиях:\n\n| | Ход 75 | Ход 100 |\n|---|---|---|\n| Производство | ×1,37 | ×1,23 |\n| Золото | ×1,38 | ×1,43 |\n\n- **Производство:** у Ахиллеса больше рабочих, улучшенных клеток и вырубок. Что именно даёт\n  молотки (шахты, здания), по журналу не видно. Молотки — единственная выдача, которую нельзя\n  честно купить обратно (мех. §2).\n- **Золото:** покупка клеток (вдвое больше среднего) и апгрейды. Что золото копится к\n  Конгрессу — гипотеза. Тратить его выгоднее на дорогое:\n  - 30 молотков стоят 164 золота (5,5 за молоток);\n  - 300 молотков — 924 золота (3,1 за молоток);\n  - **уже вложенные молотки цену не снижают** (мех. §2).\n- **Чудеса:** у Ахиллеса 9–10 чудес к 100-му ходу, у среднего игрока 5. Чудо — 25 очков\n  счёта. Если чудо построил другой, твои молотки вернутся золотом 1:1 (мех. §2).\n\n### Дипломатическая победа — основной путь\n\nАхиллес выиграл так 5 партий из 9. Что он делает:\n- **Выполняет задания городов-государств**: 18 за партию против 12 у среднего игрока.\n  Задания дают влияние без трат.\n- **Запугивает** слабые города-государства ради золота: хотя бы раз в 15 партиях из 21, у\n  остальных людей — в 35% партий. Первое запугивание — около 25-го хода.\n- **Копит золото** к поздней игре: около 4000 на 125-м ходу против 1800 у среднего игрока.\n- **Подарками покупает союзников только в части партий.** В одной партии — рывком: 10\n  подарков на одном ходу, за 14 ходов до победы, всего 14 750 золота. В другой — равномерно\n  с 75-го хода, 6250 золота. Влияние утекает 1 в ход, а золото к концу партии даёт втрое\n  меньше влияния (мех. §12). Когда дарить выгоднее — по данным не ясно.\n- В Конгрессе предлагает санкции против лидера и меценатство.\n\n### Если ведёшь в науке\n\n- Космос — 14% побед.\n- Ахиллес берёт ключевые технологии на 7–10 ходов раньше победителей:\n  - Научная теория — 93;\n  - Индустриализация — 89;\n  - Ракетостроение — 126.\n- В Nova каждый город с 4-го дорожает технологии (6×N − 4 процента). Марионетки дают\n  только ¼ науки. (мех. §4)\n\n### Смотри на соперников\n\nАхиллес открывает **демографию примерно раз в ход**. Средний игрок — раз в 2–3 хода,\nпобедители — чаще чем раз в 2 хода. Где ты\nотстаёшь, туда и вкладывай следующие 10 ходов.\n\n---\n\n## 4. Темп\n\n- Сильные игроки не думают дольше, они **успевают больше**:\n  - Ахиллес делает 27 команд за ход, средний игрок — 19;\n  - пауза между действиями у него 1,8 с, у среднего — 2,3 с;\n  - его ход короче, чем у соперников в тех же партиях.\n- Рабочие клетки в городе Ахиллес переключает **не чаще других** (0,7 раза на город за ход).\n  Его «микро» — армия (повышения, апгрейды, выстрелы) и частые заходы в экран города.\n- Совет без данных (проверить у сильных игроков): держи порядок хода — города, рабочие,\n  армия, — чтобы ничего не забыть.\n\n---\n\n## Что проверить перед публикацией\n\n- **Цифры поведения** взяты из журналов 16.09–19.10.2026:\n  - 26 партий Ахиллеса;\n  - 817 игрок-партий всех людей для сравнения.\n- **Правила мода** в живой партии не замерены. Источник — код и собранная база (раздел\n  «Что не проверено» в `osnovy-mehanik.md`).\n- **Честь:** культура за убитых варваров есть в подсказке игры, но в базе поле равно 0.\n  В гайд это не вынесено.\n- **Зона контроля и условия побед** описаны по ванили и в моде не перепроверены.\n- **Советы «почему так делать»** — гипотезы по поведению сильного игрока. Стоит показать\n  черновик самому Ахиллесу.\n", "ahilles": "# Как играет Ахиллес (Achilles): разбор по журналам партий Nova\n\nРазбор нужен для гайда новичкам. Что именно Ахиллес делает иначе, чем средний игрок, и чему\nу него стоит поучиться.\n\n> **Откуда данные.** Журналы партий `.nrl`, которые лаунчеры присылают на сервер рейтинга\n>, за период 16.09–19.10.2026. С сервера всё только\n> читалось. Исходы партий взяты из журнала рейтинга, рейтинг из таблицы рейтинга, карта для\n> анализа мест городов из файлов повторов `.Civ5Replay`.\n>\n> **Ник.** В рейтинге он **Achilles**. В одной партии (07.10, Россия, культурная победа) в игре\n> стоял ник **SnowLeopard**: это та же учётка, журнал прислан лаунчером Achilles. Обе подписи\n> учтены. SteamID в разборе не используется и не приводится.\n\n## 0. Сколько данных и насколько им верить\n\n| | |\n|---|---|\n| Сетевых партий с журналом Ахиллеса | **26**, всего **2857 ходов**. По всем 26 есть его собственный журнал |\n| Из них доиграны до победы | **14**. Ещё одна доигранная (Рим, 25.09, поражение) журнала не имеет |\n| Не доиграны | 12: свёрнуты голосованием («Скрап») или брошены. Годятся для дебюта и середины партии |\n| С чем сравниваем | 817 «игрок-партий» живых людей: 128 ников, 211 сетевых партий. Доиграно 81, в них 73 победителя и 290 проигравших (не считая Ахиллеса) |\n| Карта (река, вода, холм) | 20 его партий, где нашёлся повтор |\n| Люксы рядом с городом | 6 партий: датчик ресурсов есть только в новых журналах |\n| Бои по одному (событие 118) | **нет ни одного**: датчик появился 18.10, после последней партии Ахиллеса. Бои считались по гибели юнитов и рядам статистики |\n\nКак читать числа:\n- Почти везде стоит **медиана**, в скобках `n` — сколько игрок-партий в неё вошло.\n- **Пометки:**\n  - «факт» — прямой счёт событий журнала;\n  - «гипотеза» — моё объяснение, почему он так делает. Проверить такое по журналу нельзя.\n- **Одна оговорка на всё.** Ахиллес — сильный игрок, и его соперники это знают. Часть различий\n  может быть следствием силы, а не её причиной. Победитель дольше живёт, у него больше городов\n  и больше поводов кликать.\n\n## 1. Итоги\n\n**Рейтинг** на 19.10: **3-е место, 1096 очков, 11 партий в сезоне, 6 побед**.\nВ рейтинг идут не все партии: только FFA на 6 игроков, завершённые типом победы. Победа\nпод ником SnowLeopard (07.10) в таблицу не засчитана (отчёт STATS от 19.10). Поэтому побед\nпо журналам больше, чем в рейтинге.\n\n**Доигранных партий 15, побед 9 (60%).** При шести игроках в партии случайный игрок\nвыигрывал бы одну партию из шести, то есть около 17%. В трёх его партиях людей было пятеро,\nтам эта доля 20%. По числу побед за весь период он\nпервый на сервере: Achilles 9, Coddys 8, An4ouS_ 8, ZLOcrab 6.\n\n| Тип победы | Его победы | Его поражения (кто выиграл и чем) |\n|---|---|---|\n| Дипломатическая | **5**: Ацтеки 127, Испания 122, Испания 148, Англия 129, Венеция 112 | 4 (Coddys ×2, JAGUARRR, kekus) |\n| Научная (космос) | 1: Индия 156 | 2 (NotUrban, JAGUARRR) |\n| Военная (доминация) | 1: Франция 149 | — |\n| Культурная | 1: Россия 111 (ник SnowLeopard) | — |\n| Присуждена (`VICTORY_AWARD`) | 1: Инки 95 | — |\n\nДля фона: на сервере доиграно 83 партии, и **56 из них (67%) кончились дипломатической\nпобедой**. Медиана конца партии — 131-й ход. Дипломатия здесь — основной путь к победе,\nи Ахиллес играет именно в неё. Медиана хода его побед — около 127.\n\n## 2. Первые 30 ходов (факт)\n\n### Порядок постройки\n\nОн строит одно и то же почти во всех партиях:\n**разведчик (ход 3) → разведчик (ход 6) → монумент (ход 9–10) → рабочий (ход 12–14) →\nпоселенец (ход 17–21) → поселенец → поселенец.**\n\nЦивилизации с уникальным разведчиком или лучником ставят его на место разведчика: Шошоны —\nследопыт, Инки — пращник.\n\n| Третья постройка | Ахиллес (n=25) | Все остальные (n=716) |\n|---|---|---|\n| Монумент | **64%** | 30% |\n| Рабочий | 12% | 32% |\n| Святилище | 0% | 16% |\n\nОтличие одно: **монумент он ставит раньше рабочего и святилища почти всегда**. Остальные\nделят третью позицию между рабочим, монументом и святилищем. Святилище у него появляется\nтолько на 14–22-м ходу, а пантеон он берёт позже других: на ходу **32** против 26–27.\n\n### Покупка за золото в дебюте\n\nДо 40-го хода чаще всего покупает **рабочих** (8 покупок), реже поселенца, галеру,\nуникальный боевой юнит. Рабочий куплен до 30-го хода в 6 партиях из 22. У остальных — в 172\nиз 653, то есть различие небольшое.\n\n### Расширение (медиана хода)\n\n| | Ахиллес | Соперники в его партиях | Победители (кроме него) | Все люди |\n|---|---|---|---|---|\n| Первый поселенец готов | **19** | 20 | 21 | 21 |\n| 2-й город | **22** | 23 | 24 | 24 |\n| 3-й город | **27** | 28 | 29 | 30 |\n| 4-й город | 33 | 32 | 35 | 35 |\n| Городов на 30-м ходу | **3** | 3 | 2 | 2 |\n| Городов на 50-м ходу | **5,5** | 5 | 5 | 5 |\n| Городов на 100-м ходу | 6,5 | 6 | 5 | 6 |\n| Городов на 125-м ходу | **9** | 7 | 7 | 7 |\n\nОн ставит города на 1–2 хода раньше среднего. **К 30-му ходу у него три города против\nдвух** у победителей и у всех людей. Соперники в его партиях тоже успевают поставить три. Дальше он почти не строит новых поселенцев: основывает 5–6 городов за партию.\nОстальной рост после 100-го хода дают **захваты**: медиана 6 событий захвата за партию против\n1 у среднего игрока. В счёт входят и повторные захваты, и захваты городов-государств.\n\n### Где ставит города (20 партий с картой)\n\n| | Река в радиусе 1 | Вода рядом | Холм под городом | Видов люксов в радиусе 2 |\n|---|---|---|---|---|\n| Его столица (n=20) | 75% | 45% | 25% | 2 (n=6) |\n| Столицы соперников (n=99) | 64% | 34% | 38% | 2 (n=30) |\n| Его прочие города (n=96) | 37% | 53% | 43% | 1 (n=41) |\n| Прочие города соперников (n=466) | 51% | 46% | 41% | 1 (n=162) |\n\nЗдесь резкого отличия нет. Столица у него чуть чаще стоит у реки и у воды. Прочие города он\n**реже ставит у реки и чаще у моря**, чем соперники.\n\nЧто значит «река в радиусе 1»: река касается клетки города или соседней клетки. Это грубое\nприближение. По люксам выборка маленькая.\n\n**Вывод: места для городов он выбирает не лучше других, он ставит их раньше.**\n\n## 3. Экономика по ходам: где он отрывается (факт)\n\nСравнение с другими людьми **в тех же партиях**: его значение делится на медиану\nсоперников той же партии. ×1,00 — вровень.\n\n| Показатель | Ход 30 | Ход 50 | Ход 75 | Ход 100 | Ход 125 |\n|---|---|---|---|---|---|\n| Производство | ×1,17 | ×1,20 | **×1,37** | ×1,23 | ×1,19 |\n| Золото в ход | ×1,20 | ×1,19 | **×1,38** | **×1,43** | ×0,93 |\n| Наука | ×1,00 | ×1,10 | ×1,05 | **×1,43** | ×1,10 |\n| Культура | ×0,90 | ×1,02 | ×1,36 | ×1,16 | ×1,04 |\n| Вера | ×0,33 | ×0,70 | ×1,06 | ×1,07 | ×1,34 |\n| Население | ×1,00 | ×1,05 | ×1,11 | ×1,07 | ×1,26 |\n| Военная мощь | ×1,17 | ×1,31 | ×1,00 | ×1,31 | ×1,34 |\n| Технологии | ×1,00 | ×1,06 | ×1,02 | ×1,08 | ×1,03 |\n| Счёт | ×1,07 | ×1,12 | ×1,19 | ×1,19 | ×1,25 |\n\nАбсолютные числа (медиана; Ахиллес / все остальные люди):\n\n| | Ход 50 | Ход 75 | Ход 100 |\n|---|---|---|---|\n| Производство в ход | **85 / 55** | **252 / 152** | **484 / 306** |\n| Золото в ход | 36 / 27 | **105 / 64** | **294 / 174** |\n| Наука в ход | 35 / 29 | 156 / 109 | **526 / 326** |\n| Культура в ход | 26 / 23 | 90 / 58 | 218 / 155 |\n| Избыток счастья | 8,5 / 6 | 11 / 7 | **25 / 10** |\n| Рабочих | **9,5 / 6** | 12 / 9 | 12 / 10 |\n| Улучшенных клеток | **26 / 17** | 69 / 49 | 106 / 90 |\n| Вырубок леса (накоплено) | **160 / 81** | 225 / 140 | 242 / 184 |\n| Золота на покупку клеток (накоплено) | **352 / 160** | **795 / 400** | **1180 / 620** |\n| Чудес света построено к 100-му ходу | — | — | **9,5 / 5** |\n\n**Число технологий** у него почти такое же, как у всех: 14 против 13 на 50-м ходу и 42\nпротив 37 на 100-м. При этом **наука в ход** на 100-м ходу выше в 1,4–1,6 раза. Самый\nбольшой и самый ранний отрыв — в **производстве, золоте и счастье**: он виден уже с 30–50-го\nхода.\n\nК 50-му ходу у него в полтора раза больше рабочих и улучшенных клеток и вдвое больше вырубок\nлеса. Клетки он покупает за золото вдвое активнее остальных.\n\n**Гипотеза:** вырубка леса и много рабочих дают ранние молотки. Они уходят в чудеса (вдвое\nбольше, чем у среднего игрока) и в армию. Купленные клетки ускоряют выход на ресурсы.\nВысокий запас счастья (25 против 10 к 100-му ходу) позволяет захватывать города без\nштрафов.\n\n### Технологии\n\n- Первая технология — **Добыча (6-й ход)** в 18 партиях из 26, затем Гончарное дело и\n  Скотоводство.\n- **Бронза — на ходу 36 против 44–56** у остальных групп. Это под Колосс, Храм Артемиды и лес\n  (гипотеза).\n- **Оптика — на 55-м ходу против 59–72**: в морских стартах (Испания, Венеция, Англия) она\n  идёт сразу за Мореплаванием.\n- Поздние ключевые технологии он берёт на 7–10 ходов раньше победителей:\n  - Индустриализация — 89 (победители 96);\n  - Научная теория — 93 (101);\n  - Порох — 91 (101);\n  - Ракетостроение — 126 (135).\n\n### Политики и идеология\n\n| Первая ветка | Ахиллес (n=26) | Все остальные (n=769) | Победители (n=73) |\n|---|---|---|---|\n| **Честь** | **54%** | 16% | 10% |\n| Традиция | 8% | 35% | 33% |\n| Воля | 15% | 20% | 22% |\n| Пути (мод) | 15% | 15% | 22% |\n| Благочестие | 8% | 13% | 14% |\n\n**Самое необычное в его игре — открытие Честью.**\n- Порядок: Кодекс воина → Профессиональная армия → Дисциплина → Военная каста → Военная\n  традиция.\n- Вторая ветка — около 55–60-го хода: чаще всего Исследование (у моря), Эстетика,\n  Благочестие, реже Меценатство, Коммерция, Оплот.\n- Рационализм — с 80–100-го хода.\n\nИдеологию он берёт на **92-м ходу против 101** у остальных:\n- Автократия — 9 раз;\n- Порядок — 4;\n- Свобода — 3.\n\n**Что даёт Честь в Nova** (собранная база игры и русский текст подсказки):\n- **+33% к бою с варварами**, видно, где появляются их лагеря (`BarbarianCombatBonus = 33`,\n  `AlwaysSeeBarbCamps`);\n- **Кодекс чести:** +15% к производству юнитов ближнего боя (по тексту);\n- **Профессиональная армия:** −33% к цене апгрейда юнитов — **только по тексту подсказки**.\n  В базе у политики `UnitUpgradeCostMod = 0`, так что работает ли скидка — **не проверено**.\n- Подсказка обещает и **культуру за убитых варваров**, но поле `CultureFromBarbarianKills`\n  у политики в базе равно 0. Это тоже **не проверено**.\n\n**Гипотеза, зачем Честь.**\n- Он охотится на варваров раньше и больше всех (раздел 5).\n- **Апгрейдов делает в 3,5 раза больше среднего.** Если скидка Профессиональной армии\n  работает (не проверено), они ему дешевле.\n\n### Религия\n\n- Религию основывает **всегда**: во всех 18 его партиях длиной от 100 ходов, на ходу 57\n  (медиана). У остальных медиана 58.\n- Любимый пантеон — **Бог моря** (5 раз). У остальных чаще всего **Голос прибоя** и Бог\n  моря.\n- Покупками за веру пользуется даже чуть меньше среднего: 1,2 на 100 ходов против 1,5.\n\n### Чудеса\n\nМедиана по партиям длиной от 100 ходов: **14 чудес за партию против 7** у среднего\nчеловека и 10,5 у победителей.\n\nЧаще всего строит:\n- Бранденбургские ворота — 12 раз;\n- по 9 раз: Химэдзи, Великая стена, Святая София;\n- по 8 раз: Боробудур, Альтинг, Нотр-Дам, Сикстинская капелла, Прора, Метро (мод).\n\n## 4. Города-государства и дипломатия (факт)\n\n| | Ахиллес | Победители | Все люди |\n|---|---|---|---|\n| Запугиваний ради золота | 2 за партию, первое на 25-м ходу | 0 | 0 |\n| Золота запугиванием (накоплено к 125-му ходу) | **225** | 0 | 0 |\n| Подарков золотом | 1 (500 золота) | **5 (2000)** | 1,5 (500) |\n| Раз стал союзником | 3 | **7** | 3 |\n| Заданий ГГ выполнено | **18** | 17,5 | 12 |\n| Обетов защиты | 8 | 6 | 7 |\n| Делегатов на 150-м ходу | 10 | 11 | 9 |\n\n**Запугивает он чаще других:** хотя бы раз — в 15 партиях из 21, у остальных людей — в\n214 из 616 (35%). Первое запугивание у тех, кто запугивает, приходится примерно на 25-й ход и\nу него, и у других.\n\nПокупать города-государства подарками он предпочитает только в отдельных партиях:\n- **Испания, 2.10:** 19 подарков на 14 750 золота, **10 из них — на одном 134-м ходу**,\n  за 14 ходов до победы. Это рывок → дипломатическая победа;\n- **Ацтеки:** 16 подарков на 6250 золота **равномерно с 75-го по 123-й ход** →\n  дипломатическая победа.\n\n«Союзов» в таблице — сколько раз он становился союзником за партию, а не сколько союзников\nбыло одновременно.\n\nЧаще союзников приносят **задания** городов-государств: 18 за партию против 12.\n\n**Гипотеза.** Дипломатическую победу он делает голосами за счёт:\n- **большой казны** к поздней игре: 4147 золота на 125-м ходу против 1784;\n- **заданий городов-государств**;\n- **войны против лидера** (раздел 5).\n\nНе за счёт постоянных подарков.\n\n## 5. Война (факт)\n\n| | Ахиллес | Победители | Все люди |\n|---|---|---|---|\n| Первая война с державой, кто бы ни объявил | ход 59 | 72 | 63 |\n| Первая война, объявленная **ему** | ход **64,5** | — | 73,5 |\n| Первая война, объявленная им самим | ход 76,5 | 78 | 71 |\n| Войн объявил державам за партию | 1,5 | 2 | 1 |\n| Убил варваров (за партию от 100 ходов) | **29,5** | 11 | 12 |\n| Первый убитый варвар | ход **20** | 25 | 23 |\n| Убил юнитов держав | **47** | 34,5 | 11 |\n| Потерял юнитов | 27 | 15,5 | 16,5 |\n| Боевых юнитов построено | **57** | 51 | 29 |\n| Повышений получено | **189** | 148 | 47 |\n| Улучшений юнитов (апгрейд) за партию | **46** | 32,5 | 13 |\n\n- Рано войну **сам не начинает** (76-й ход), но **ему объявляют войну раньше, чем другим**:\n  на 64,5-м ходу против 73,5 у остальных. Он успевает подготовиться: к 50-му ходу его армия ×1,31 к соперникам.\n- **Размен в его пользу.** Убивает 47 юнитов держав, теряет 27. У среднего человека 11\n  против 16,5.\n- **Ранняя армия маленькая:** 2 боевых юнита без разведчиков к 50-му ходу против 1 у\n  остальных. Состав: лучники, колесничные лучники, галеры, уникальные юниты цивилизации.\n  Всё это время она бьёт варваров: к 50-му ходу убито 11 юнитов против 6.\n- **Поздняя армия — конная и бронетехника с авиацией:**\n  - кавалерия — 173 юнита по всем партиям;\n  - бомбардировщики — 90 и 72 (Первой мировой);\n  - танки — 84 и 38 (Первой мировой);\n  - линкоры — 48, противотанковые пушки — 42, фрегаты — 40.\n- **Повышения:**\n  - чаще всего: Построение I, Муштра I, Натиск I, Бомбардировка I–III, Построение II;\n  - Муштру I (бой на пересечённой местности) он берёт даже **на 30% чаще**, чем Натиск I;\n  - у соперников Натиск I встречается в 1,5 раза чаще Муштры I.\n- **Апгрейды он делает в 3,5 раза чаще среднего:** 46 за партию против 13. Армию он не\n  строит заново, а обновляет за золото.\n\n## 6. «Клики»: сколько и как он управляет (факт)\n\nИсточник — приказы и команды из журнала. Время считается по часам его машины.\n\n| | Ахиллес | Соперники в его партиях | Победители | Все люди |\n|---|---|---|---|---|\n| Команд за ход (все, кроме открытия экранов) | **27,2** | 23,0 | 25,6 | 19,3 |\n| Приказов юнитам за ход | **15,5** | 12,4 | 14,6 | 11,3 |\n| Заходов в экран города за ход | **9,3** | 7,4 | 7,5 | 5,7 |\n| Открытий демографии за ход | **1,0** | 0,8 | 0,6 | 0,4 |\n| Смен производства за ход | 2,3 | 1,8 | 2,0 | 1,5 |\n| Смен рабочих клеток и специалистов на город за ход | 0,7 | 0,8 | 0,8 | 0,7 |\n| Смен фокуса города за партию | 11 | 8 | 8 | 7 |\n| Покупок за золото на 100 ходов | 11,6 | 10,5 | 12,4 | 6,3 |\n| Повышений вручную на 100 ходов | **107** | 48 | 62 | 21 |\n| Пауза между своими командами, с | **1,8** | 2,0 | 2,2 | 2,3 |\n| Сколько длится его активность внутри хода, с | 71 | 79 | 87 | 66 |\n\nКак распределены приказы юнитам:\n- перемещение — 50%;\n- постройка рабочим — 28%;\n- сон — 7%;\n- выстрел — 5%;\n- укрепление — 4%.\n\nУ соперников то же, только сна и выстрелов меньше.\n\nЗадачи городов:\n- смена клетки — 78%;\n- добавить специалиста — 10%;\n- выстрел города — 6%.\n\n**Важно для гайда.** Рабочих клеток в расчёте на город он переключает **не чаще** других\n(0,7). Его «микро» — это:\n- **армия:** повышения, апгрейды, выстрелы;\n- **частые заходы в экран города:** проверяет очередь и покупку;\n- **демография:** в среднем раз в ход сверяется с соперниками.\n\nТемп выше: пауза между действиями 1,8 с против 2,3 с. Его ход короче, чем у соперников в\nтех же партиях и у победителей, но чуть длиннее среднего по всем людям (71 с против 66).\n**Он делает больше примерно за то же время.**\n\n## 7. Чему новичку учиться у Ахиллеса\n\n1. **Дебют по шаблону: разведчик, разведчик, монумент, рабочий, поселенцы.**\n   - Три города к 30-му ходу — его норма.\n   - Святилище и пантеон могут подождать до 20–30-го хода.\n2. **Рабочих должно быть много.**\n   - К 50-му ходу у него 9–10 рабочих против 6.\n   - Лес вырубай на молотки: в дебюте это бесплатное производство.\n3. **Покупай клетки за золото:** вдвое больше среднего. Клетку с ресурсом мод продаёт по\n   базовой цене, как бы далеко она ни была.\n4. **Держи запас счастья.** У него +25 к 100-му ходу против +10 у других. В Nova штрафы\n   начинаются уже с −1, а запас позволяет брать чужие города.\n5. **Честь в начале и охота на варваров.**\n   - +33% к бою с варварами, опыт для юнитов, награды за лагеря.\n   - Первый варвар у него убит на 20-м ходу.\n   - Дальше Профессиональная армия: апгрейды на треть дешевле.\n6. **Армия, которая не умирает.**\n   - Повышай юнитов сразу. Муштра нужна не меньше Натиска.\n   - Обновляй армию апгрейдами за золото, а не строй заново.\n   - Размен у него примерно 1,7:1 в свою пользу.\n7. **Готовься к тому, что объявят тебе.** Ему объявляют войну в среднем на 64-м ходу, а\n   сам он объявляет на 76-м.\n8. **Чудеса — производством,** а не покупкой. 9–10 чудес к 100-му ходу при среднем 5.\n9. **Дипломатическая победа** (две трети партий на сервере кончаются ею):\n   - копи золото к Конгрессу;\n   - выполняй задания городов-государств;\n   - союзников он докупает подарками только в части партий: в одной — рывком за 14 ходов\n     до победы (14 750 золота), в другой — равномерно со второй половины партии (6250).\n10. **Смотри демографию каждый ход:** где ты отстаёшь, туда и вкладывай.\n\n## 8. Чего здесь нет и что не проверено\n\n- **Бои по одному** (кто, где, каким юнитом) не разобраны: датчика 118 в его журналах нет.\n  Здоровье, фланги и местность по журналу не видны.\n- **Автоматизация рабочих.** Счётчик автоматизации равен 0 у всех 817 игрок-партий.\n  Вероятнее всего, журнал её просто не пишет, поэтому вывод «автоматизирует / нет» сделать\n  нельзя.\n- **Время хода** считается по меткам времени машины, на которой лежит журнал. Пауза в\n  1,8 с — это скорее темп, чем точное время раздумья.\n- **Захваты** считаются по смене владельца названия города. Повторный захват и захват\n  города-государства идут в тот же счёт, так что число захватов завышено.\n- **Номера сущностей** (юниты, здания, политики) переведены в ключи по нынешней собранной\n  базе игры. Для партий с 16.09 это корректно.\n- **Небольшие выборки:** 14–26 партий у Ахиллеса, а к 150-му ходу всего 5 значений. Числа\n  по позднему ходу — ориентир, не закон.\n- **Нет «почему».** Почему он выбирает Честь или запугивает, по журналу не видно. Все\n  «гипотезы» выше стоит проверить разговором с ним самим.\n", "mehaniki": "# Основы механик Civ5 (BNW) в моде Nova\n\nГайд для новичка: как устроена экономика и война **именно в Nova**, с числами мода.\nСоревновательные партии идут на **Быстрой** скорости, поэтому числа даны для неё (и для\nСтандартной, где это полезно для сравнения).\n\nОткуда числа (пометки в тексте):\n- **[К]** — карточка (статус `partial`: код и база прочитаны, в игре не замерено) карточка знаний проекта (разобран код\n  движка и собранная база). Номер после буквы — раздел карточки: [К13] = раздел 13.\n- **[Б]** — собранная база игры `Civ5DebugDatabase.db` (итог после всех правок мода).\n- **[Код]** — прочитано в коде движка `Civ5-Patch` при подготовке этого гайда.\n- **(ваниль, в моде не проверено)** — взято из знаний об обычной BNW, в моде не сверено.\n\nНи одно число не проверено замером в живой партии — только код и база. Подробности в конце.\n\n---\n\n## Шпаргалка главного\n\n1. **Мир между людьми на Быстрой держится 1 ход** — его можно разорвать уже на следующем ходу [К0].\n2. **Счастье ниже нуля — штраф сразу**, а не с −10: рост −75%, производство, золото и сила\n   юнитов −2% за каждую единицу минуса (до −40%) [К6].\n3. **В бою нет случайности**: равные по силе юниты всегда наносят друг другу 29 урона;\n   повышение «Исцеление» лечит всего 10 [К13].\n4. **Каждый новый город удорожает политики (+10%) и науку (+6 п.п. с 4-го города)**, и считается\n   рекорд городов за партию — потерянные города штраф не снимают [К9, Код].\n5. **Покупать дешёвое за золото невыгодно** (30 молотков ≈ 164 золота), перелив производства\n   ограничен, а простаивающий город хранит запас всего на 1 ход [К1, К7].\n\n---\n\n## 1. Еда и рост\n\n- Каждый житель ест **2 еды** (`FOOD_CONSUMPTION_PER_POPULATION = 2`) [К5].\n- Порог роста: `15 + (размер−1)×8 + (размер−1)^1,5`, затем × скорость (Быстрая **×0,67**) [К5].\n  Числа совпадают с ванилью.\n\n| Рост | Стандартная | Быстрая |\n|---|---|---|\n| 1 → 2 | 15 | 10 |\n| 3 → 4 | 33 | 22 |\n| 5 → 6 | 55 | 36 |\n| 10 → 11 | 114 | 76 |\n| 15 → 16 | 179 | 119 |\n\n- Излишек еды сверх порога **не сгорает** — остаётся в закроме. Акведук сохраняет ещё 40% [К5].\n- Голод обнуляет закром и только потом съедает жителя; город размером 1 от голода не умирает [К5].\n- Захваченный город начинает с пустым закромом [К5].\n- **Руины дают еду, а не жителя** (на Быстрой ≈13 еды ближайшему городу) — это правка мода [К5].\n- «Мы любим короля» даёт +25% к росту, но **только если держава не в минусе по счастью** [К5].\n\n## 2. Производство\n\n**Перелив.** Когда предмет готов, лишние молотки переносятся на следующий, но не больше\nпотолка: `потолок = max(цена готового предмета, выработка города за ход)` [К1].\nВсё сверх потолка превращается в золото **по курсу 0,25** (¼ золота за молоток) [К1].\n\n**Простой.** Город, которому нечего строить, хранит **ровно выработку одного хода**, сколько бы\nни стоял. Копить молотки «в пустоту» под чудо не выйдет [К1].\n\n**Усушка отложенного** (только у людей, у ИИ нет) [К1]:\n\n| Что отложено | Начинает таять после | Теряет за ход |\n|---|---|---|\n| Здание, чудо | 50 ходов | 1% |\n| Юнит | 10 ходов | 2% |\n\n**Чудо построил другой** — твои молотки возвращаются золотом **1:1** [К3].\n\n**Покупка за золото**: `цена = (молотки × 30)^0,75`, плюс надбавка вида предмета, вниз до\nдесятка [К7]. Курс тем лучше, чем дороже предмет:\n\n| Молотков в предмете | Золота | Золота за молоток |\n|---|---|---|\n| 30 | 164 | 5,5 |\n| 100 | 405 | 4,1 |\n| 300 | 924 | 3,1 |\n| 1000 | 2279 | 2,3 |\n\n- **Уже вложенные молотки цену не снижают** — платишь как за пустой предмет [К7].\n- На Быстрой покупка стоит ≈74% от Стандартной (а молотки — 67%), то есть покупать\n  относительно выгоднее [К7].\n- Примеры на Быстрой: воин 140, рабочий 160, монумент 200, библиотека 300, храм 370 [К7].\n- Проекты за золото не покупаются вообще [К7]. Поселенец не дорожает с числом городов [К7].\n- Фабрика даёт +10% **только при угле** (правка мода, из Lekmod) [К2].\n- Проценты к производству **складываются**, а не перемножаются [К2].\n\n## 3. Золото\n\n**Содержание зданий** (золото в ход, [Б]): монумент 1, святилище 1, амбар 1, библиотека 1,\nхрам **2**, университет 2, мастерская 2, водяная мельница 2, гавань 2, колизей 1, зоопарк 2,\nстадион 2, фабрика 3, общественная школа 3, телебашня 3, аэропорт 5.\nБесплатно содержатся: рынок, банк, монетный двор, караван-сарай, стены, замок, отель.\n\n**Дороги**: дорога **1** золото в ход, железная дорога **2** [Б, `Routes.GoldMaintenance`].\n\n**Юниты**: база **0,5 золота за юнит** (`INITIAL_GOLD_PER_UNIT_TIMES_100 = 50`), дальше цена\nрастёт с ходом партии: множитель `1 + 8 × доля пройденной игры`, затем степень\n`1 + доля/7` [Б, Код `CvTreasury::CalculateUnitCost`]. К концу партии каждый юнит стоит в разы\nбольше, чем в начале. Сколько юнитов бесплатно — в моде не проверено (на сложности Князь/Король\n`GoldFreeUnits = 0`, но есть и другие источники бесплатных).\n\n**Инфляции нет** — в коде расчёт инфляции выключен («Inflation bad. Money good.») [Код].\n\n**Связь городов дорогой** с столицей даёт золото: `(−100 + 15 × население столицы + 110 × население города) / 100`.\nПример: столица 10, город 8 → **9,3 золота в ход** [К10].\n\n**Покупка клетки**: `50 + 5 × (сколько клеток ты уже купил)`, дороже за дальность, на Быстрой\n×0,67, округление до 5 [К12]. Счётчик общий на всю державу. **Клетка с ресурсом стоит базовую\nцену, как бы далеко ни была** [К12]. Купить можно не дальше 3 клеток от города.\n\n## 4. Наука\n\n- Житель даёт **1 науку** (`SCIENCE_PER_POPULATION = 1`) [Б].\n- Цена технологии: `Technologies.Cost × размер карты × скорость`. Стандартная карта ×1,10,\n  Быстрая скорость **×0,67** [К9]. Пример базы: Письменность 55, Философия 175,\n  Образование 485, Электричество 2350.\n- **Штраф за города** (правка, пришла из 12.1d) [К9]:\n\n| Городов | +к цене технологии |\n|---|---|\n| 1 | 5% |\n| 2 | 9% |\n| 3 | 14% |\n| 4 и больше | 6×N − 4 (4 → 20%, 6 → 32%, 10 → 56%) |\n\n- Считается **рекорд** числа городов за партию: потерял или отдал город — штраф остался [К9].\n- **Марионетки в штраф не входят**, но дают только **¼ науки и культуры** (в ванили ¾):\n  `PUPPET_SCIENCE_MODIFIER = −75` [К0].\n- Скидка, если технологию уже знают другие, — до −23%; в сетевой партии считаются **только\n  живые игроки** [К9].\n- Перелив колб между технологиями есть, потолок `max(5 ходов науки, сырая цена технологии)` [К9].\n\n## 5. Культура и политики\n\n**Цена политики** [Код `CvPlayerPolicies::GetNextPolicyCost`, Б]:\n\n```\nцена = 25 + (3 × взято_политик)^2,01\nцена += цена × (городов − 1) × 10%      ← 10% на Дуэли/Крошечной/Малой/Стандартной карте\n                                           (Большая 7,5%, Огромная 5%)\nцена × скорость (Быстрая 0,67), вниз до кратного 5\n```\n\nГорода — снова **рекорд за партию без марионеток** (`GetMaxEffectiveCities`). Примеры:\n\n| Политика № | Быстрая, 1 город | Быстрая, 4 города | Быстрая, 8 городов | Стандартная, 1 город |\n|---|---|---|---|---|\n| 1-я | 15 | 20 | 25 | 25 |\n| 3-я | 40 | 50 | 65 | 60 |\n| 5-я | 115 | 145 | 195 | 170 |\n| 8-я | 320 | 415 | 545 | 475 |\n| 11-я | 640 | 830 | 1085 | 955 |\n\n(Расчёт по формуле; бесплатные политики в счёт «взято» не входят.)\n\n**Ветки** [Б, `PolicyBranchTypes`]: Традиция, Воля, Честь, Благочестие (закрыто без религии\nв партии), Меценатство и Эстетика (с Классики), Коммерция, Мореходство и **Оплот** (со\nСредневековья), Рационализм (Ренессанс), идеологии Свобода / Порядок / Автократия\n(Индустриальная). Свои ветки мода: **Пути** (дороги и караваны: +100% к производству караванов\nи грузовых судов, защита их от грабежа без войны) и **Наследие** (в каждой новой эпохе выбираешь\nодин постоянный бонус).\n\n- Смена идеологии стоит дороже: теряется **3** принципа (ваниль 2) [К0].\n- Традиция удешевляет **рост границ** сильнее всего — режет показатель степени [К12].\n\n**Границы.** Новая клетка культурой: 1-я — 10, 5-я — 45, 10-я — 100, 20-я — 225 культуры\nна Быстрой [К12]. Культурой город берёт клетки до 5 колец, работает до 3 [К12].\n\n## 6. Счастье\n\n**Откуда берётся** [Б]:\n- старт: **9** на сложностях Князь…Божество (на Поселенце 15) (`HappinessDefault`);\n- **каждый вид люкса — 4** (первый экземпляр; лишние копии дают 0, `HAPPINESS_PER_EXTRA_LUXURY = 0`).\n  Исключения мода: вино, пиво, коньяк — 5; рис, картофель, ячмень — 3; мускат, гвоздика,\n  перец — 2;\n- здания: колизей 2, цирк 2, зоопарк 2, стадион 2, Большой цирк (национальное) **+5**;\n  храмы религии: собор 3, мечеть и пагода 1;\n- чудо природы в границах — 1; города-государства (торговые друзья) — 2…4 [К11].\n\n**Откуда недовольство** [К6, Б] (всё как в ванили):\n\n| Источник | Недовольство |\n|---|---|\n| Каждый город | 3 |\n| Каждый житель | 1 |\n| Захваченный неприсоединённый город (вместо 3) | 5 |\n| Житель такого города (вместо 1) | 1,34 |\n\nНа Большой карте город стоит 80%, на Огромной 60%.\n\n**Что бывает в минусе.** Внимание: в моде движок использует константы\n`VERY_UNHAPPY_*_PER_UNHAPPY` (линейный штраф), а **срабатывают они с −1, не с −10** —\nпроверено в базе и коде [К6, Б]:\n\n| Избыток счастья | Что происходит |\n|---|---|\n| от −1 | рост **−75%**; производство, золото и **сила юнитов −2% за каждую единицу минуса** (не больше −40%) |\n| −10 и ниже | рост **остановлен** (−100%), нельзя строить поселенцев и основывать города, каждые 4–6 ходов приходят повстанцы-варвары |\n| −20 и ниже | штрафы упираются в −40%; города могут **восстать и уйти** к другой державе, но только если есть недовольство от чужой идеологии |\n\nОтдельных ванильных `VERY_UNHAPPY_COMBAT_PENALTY` / `…_PRODUCTION_PENALTY` в базе мода нет —\nих заменили линейные варианты `…_PER_UNHAPPY` [К0].\n\n**Золотой век**: копится избыток счастья (пока века нет); порог 500, +250 за каждый следующий век,\n+1% за каждый город сверх первого; длится **8 ходов на Быстрой** [К6].\n\n## 7. Вера и религия\n\n- **Пантеон: 23 веры** (ваниль 10), на Быстрой ×0,67 → **15** [Б, Код `CvGameReligions::Init`].\n  Пантеон **не дорожает**, когда его берут другие (`…DELTA_NEXT_PANTHEON = 0`) [К0].\n- **Великий пророк** приходит **без случайности**, ровно при наборе цены [К8]:\n\n| Пророк | 1-й | 2-й | 3-й | 4-й | 5-й |\n|---|---|---|---|---|---|\n| Стандартная | 300 | 300 | 500 | 800 | 1200 |\n| Быстрая (×0,67) | ≈200 | ≈200 | ≈335 | ≈535 | ≈805 |\n\n  (Множитель скорости для пророка — [Код `GetCostNextProphet`].)\n- Религий в партии помещается: Стандартная карта — **6**, Малая 6, Крошечная 4 [Б].\n- **Покупка за веру не дорожает с эпохой** (`Eras.FaithCostMultiplier = 100` у всех эпох;\n  в ванили до ×5) [К8]. Миссионер 200 веры, на Быстрой **130** [К8].\n- Здания за веру — тоже без надбавки за эпоху [К8].\n- **Великие люди за веру** — с Индустриальной эры: через верование (1000 веры, по одному каждого\n  вида) или через закрытую ветку политик (лестница 675 → 1000 → 1675 → 2350 → 3250, дальше +900) [К8].\n  Учёный за веру — один за партию [К14].\n\n## 8. Туризм и культурная победа\n\n- **Великое произведение даёт 4 культуры и 4 туризма** (ваниль 2 и 2) [К0, Б].\n  Культурная победа в Nova заметно живее ванильной.\n- Слоты [Б]: дворец 1, амфитеатр 1, оперный театр 1, национальный эпос 1, музей 2, телебашня 1.\n- Поправки туризма к конкретной стране [Б]: общая религия +25%, торговый путь +25%, открытые\n  границы +25%, **разные идеологии −34%**, дипломат в столице **+15%** (ваниль 25%).\n- Временный всплеск культуры от великих людей вчетверо слабее ванили (`TEMPORARY_CULTURE_BOOST_MOD = 25`) [К0].\n- Археологических раскопок больше: 8–12 на игрока (ваниль 5–8) [К0].\n- Культурная победа: стать **«влиятельным»** во всех других цивилизациях — твой накопленный туризм\n  у них не меньше их накопленной культуры (`CULTURE_LEVEL_INFLUENTIAL = 100`) (ваниль, в моде не\n  проверено — механика порога не разбиралась).\n- Туризм ускоряет твой шпионаж против того, на кого давит [К4].\n\n## 9. Великие люди и специалисты\n\n- Любой специалист даёт **3 очка** своего великого в ход [Б, К14]. Выдача специалистов [Б]:\n  учёный +3 науки, инженер +2 производства, торговец +2 золота, писатель/художник/музыкант\n  +3 культуры, **интендант** (специалист мода) +3 еды. Какие здания дают слоты интенданта —\n  не проверено (у стен и замка тип указан, но число слотов 0).\n- Порог великого: `100 + 100 × уже рождённых` × скорость (Быстрая ×0,67): 67, 134, 201… [К14].\n- **Счётчики раздельные** (правка Nova): взял учёного — инженер и торговец не дорожают [К14].\n  Писатель/художник/музыкант тоже раздельные.\n- Великий полководец: порог 200, +50 за каждого [Б].\n- **Великий учёный даёт науку за последние 8 ходов до своего рождения, и с каждым ходом\n  ожидания меньше** — тратить сразу [К14].\n- Великий человек, полученный даром (чудо, политика), **не удорожает** следующего [К14].\n- Улучшения великих [Б]: академия **8 науки** (+2 Научная теория, +2 Атомная теория);\n  таможня **4 золота, +4 за Экономику** (ваниль +1); мануфактура **6 производства и 1 еда,\n  +3 за Химию** (ваниль 4 и +1); святое место 6 веры; **цитадель +3 еды, производства, золота,\n  науки и культуры** и +100% к защите (в ванили цитадель выдачи не даёт).\n- Великих нельзя дарить городам-государствам [К14].\n- Великие за золото: закрытое Меценатство + Индустриальная эра, **1000 золота**, по одному каждого\n  вида, учёный исключён [К7].\n\n## 10. Улучшения рабочих\n\nБазовые выдачи и прибавки от технологий [Б, `Improvement_Yields`, `Improvement_TechYieldChanges`]:\n\n| Улучшение | Даёт | Прибавки |\n|---|---|---|\n| Ферма | +1 еда | +1 еда у пресной воды с Гос. службой; без воды +1 с Удобрениями |\n| Шахта | +1 производство | +1 с Химией; на золоте/серебре/меди +1 золото |\n| Торговый пост | +1 золото | +1 с Экономикой |\n| Лесопилка | +1 производство | **+1 производство со Сталью** (ваниль — Научная теория), **+1 золото с Экономикой** (в ванили нет) |\n| Пастбище | только на ресурсе: лошади, коровы +1 производство; овцы +1 еда | +1 еда с Удобрениями |\n| Плантация | только на ресурсе: обычно +1…2 золота, у части люксов культура, вера, еда или производство | +1 еда с Удобрениями |\n| Лагерь | только на ресурсе: олени, бизоны +1 производство; меха, слоновая кость, трюфели, мёд, сыр +1 еда +1 золото | +1 золото с Экономикой |\n| Каменоломня | только на ресурсе: мрамор, камень, известняк +1 производство | +1 с Химией |\n| Рыбацкие лодки | рыба +1 еда, киты +2 производства, жемчуг +3 золота, крабы +1 еда +1 золото | +1 золото с Компасом |\n| Нефтяная скважина / платформа | нефть +3 производства | — |\n| Форт | +50% к защите | — |\n\n- **Известняк** (ресурс мода) даёт +10% к производству обычных зданий в своём городе;\n  **мрамор** +15% к чудесам [К2].\n- Железная дорога до столицы даёт городу +25% производства [К2].\n- Поправки к выдаче на конкретной местности (холм, лес, пресная вода у других улучшений) —\n  ваниль, в моде не проверены.\n\n## 11. Торговые пути\n\n- **Караван** 75 молотков, **грузовое судно** 100 (на Быстрой ×0,67 → 50 и 67) [Б].\n- **Дальность**: суша **10**, море **20** клеток; +50% от караван-сарая/гавани, +10 морю за\n  Астрономию и Холодильник, +10 суше за ДВС [К10].\n- Путь живёт **ровно 20 ходов**, сколько бы ни был длинным [К10].\n- Слотов в начале **ноль**: +1 за каждую из 8 технологий (Скотоводство, Мореплавание, Инженерия,\n  Компас, Банковское дело, Биология, Железная дорога, Пенициллин), плюс чудеса и политики [К10].\n  Финишер «Путей» даёт +1 путь за каждую эпоху начиная со Средневековья [К10].\n\n**Что дают** [К10]:\n- **Внешний путь** — золото: база 1 + доходы обоих городов /20 + **0,5 за каждый ресурс,\n  которого нет у второго города** + здания (караван-сарай **+4** на суше, гавань +1 на море).\n  **Морской путь даёт вдвое больше** сухопутного (+100%); город отправителя на реке — +25% суше.\n  Пример: сухопутный ≈ 14 золота, тот же морем ≈ 22.\n- Наука за внешний путь: `округление вверх (разница технологий / 2)`, минимум 1, обеим сторонам;\n  города-государства науки не дают.\n- **Расстояние на доход не влияет** — только на то, можно ли проложить путь.\n- **Внутренний путь** (еда или производство) — 3 в Древности, +0,5 за эпоху получателя\n  (6,5 в Будущем); морской вдвое. Нужен амбар (еда) или мастерская (производство) в\n  городе-отправителе. Производство от пути **умножается** фабрикой и прочими процентами.\n\n## 12. Города-государства\n\n- Типов **семь**: морской, торговый, культурный, религиозный, военный + научный и промышленный\n  (из 12.1d) [К11].\n- Пороги влияния: **друг 30, союзник 60**, потолок 120, на войне сразу **−60** (и не вернётся с\n  миром) [К11]. Влияние утекает 1 в ход; на Быстрой всё **×1,25** [К11].\n- Подарок золотом: 250 → 25, 500 → 50, 1000 → 105 влияния в начале партии; к концу золото\n  слабее втрое [К11]. Подарок юнитом +5. Задание «дорога» 50, «лагерь варваров» **30** (ваниль 50).\n- Что дают (друг + союзник складываются) [К11]: морской — еда столице (+2 друг, +4 союз в\n  Древности), промышленный — то же производством, торговый — **счастье только другу** (2…4),\n  союз ничего не добавляет; культурный 6…18 культуры, религиозный 4…16 веры, научный 4…30 науки\n  по эпохам; военный дарит юнитов (союзнику раз в ~14 ходов). Люксы и стратегические — только союзнику.\n\n**Изменения мода** [К0]:\n- великие люди от городов-государств приходят **чаще**: база **24 хода** (ваниль 37);\n- наука от союза слабее: `MINOR_CIV_SCIENCE_BONUS_MULTIPLIER = 15` (ваниль 25);\n- обет защиты держит точку покоя **+10** (ваниль +5);\n- счастье от друзей с Средневековья **4** (ваниль 3), культура от них в Индустриальную 9 (ваниль 13);\n- военные ГГ союзнику дарят юнитов на 6 ходов чаще (ваниль на 3).\n\n## 13. Бой\n\n**Здоровье** у юнита **100**, у города **200** (город лечит 20 в ход) [Б].\n\n**Урон без случайности** (`NO_RAND_DAMAGE`) [К13]:\n\n| Отношение сил | Урон сильному | Урон слабому |\n|---|---|---|\n| 1 : 1 | 29 | 29 |\n| 1,5 : 1 | 23 | 39 |\n| 2 : 1 | 17 | 51 |\n| 3 : 1 | 9 | 90 |\n\n- Раненый юнит **не слабеет в защите** и бьёт почти в полную силу (на 10 здоровья — 71%) [К13].\n- Большинство процентов силы **складываются**, сила не падает ниже 10% от базовой. Исключения\n  по карточке: фланг, укрепление и штраф дальнего выстрела применяются отдельным множителем [К13].\n\n**Модификаторы** [К13, Б]:\n\n| Что | Сколько |\n|---|---|\n| Фланг | **+10% за каждый твой боевой юнит**, стоящий вплотную к цели (кроме атакующего) |\n| Холм или гора (защита) | **+25%** |\n| Лес, джунгли (защита) | **+25%**; **лес на холме — всё равно +25%**, не +50% |\n| Болото −15%, оазис и пойма −10% | |\n| Атака через реку | **−20%** |\n| Высадка с воды на сушу | −50% |\n| Укрепление | +20% за ход, максимум **+40%** (2 хода) |\n| Форт / цитадель | +50% / +100% сверху к местности |\n| Великий полководец рядом (2 клетки) | +15%; **великий маршал мода ауры не даёт** |\n| Недовольство | до −40% (см. раздел 6) |\n\n**Опыт и повышения** [Б]: атака в ближнем бою 5 опыта, защита 4, обстрел 2, атака города 5\n(ближний) / 3 (дальний); за один бой от 1 до 10. Шаг уровня `EXPERIENCE_PER_LEVEL = 10`;\nсколько опыта до 2-го, 3-го… повышения — ваниль (10, 30, 60, 100…), в моде не проверено.\nВ сетевой игре опыт за бой с ИИ ограничен 45 [К13].\n\n**Лечение** [Б]: в городе 25, на своей земле 20, на ничьей и вражеской 10, за грабёж +25.\n**Повышение «Исцеление» — только 10** (ваниль 50) [К0].\n\n**Дальний бой** [К13]: обстрелянный не отвечает; урон по рабочему/поселенцу 40. Правки мода:\nмушкетёр на дистанции 2 стреляет вполсилы, пушка и требушет теряют урон на предельной дальности.\n\n**Зона контроля (ЗОК)** включена (`ZONE_OF_CONTROL_ENABLED = 1`) [Б]. Правило — переход между\nдвумя клетками рядом с вражеским боевым юнитом съедает все очки хода (ваниль, в моде не\nпроверено). Мод: **ударный вертолёт ЗОК не создаёт** (`Units.NoZOC`, признак `UNIT_NO_ZOC`) [Б, Код].\n\n**Города** [К13, Б]: сила = 8 + 0,4 за жителя + здания (**стены +5, замок +7, арсенал +9,\nвоенная база +12**) + доля гарнизона + большая прибавка за изученные технологии к концу игры;\n**+5 на холме**. Город стреляет на **2** клетки силой 75% от своей — **без вклада стен**.\nЗахват юнита: шанс 10% + отношение сил × 40, максимум 80%, пленный с **75%** здоровья (ваниль 50%).\n\n**Мир на Быстрой — 1 ход между людьми** (`GameSpeeds.PeaceDealDuration = 1`, в ванили 10);\nс ИИ — 5 ходов [К0].\n\n## 14. Типы побед\n\nВ базе мода есть [Б, `Victories`]:\n\n| Победа | Как |\n|---|---|\n| По времени | наибольший счёт на последнем ходу (на Быстрой партия рассчитана на **330 ходов**, по `GameSpeed_Turns`; лобби может изменить) |\n| Научная | построить и запустить космический корабль |\n| Военная (Доминирование) | владеть всеми исходными столицами (ваниль, в моде не проверено) |\n| Культурная | стать влиятельным во всех цивилизациях |\n| Дипломатическая | набрать голоса в Конгрессе / ООН (ваниль, в моде не проверено) |\n| **Скрап** (мод) | **ничья голосованием** из окна «Путь к победе»; победой не считается (`WinsGame = 0`) |\n\nКакие победы включены в конкретной партии — выбирается в лобби; база этого не говорит.\n\n**Рейтинг (ладдер Nova)** — сезон до 01.11.2026, в зачёт идут **только партии FFA на 6 игроков,\nзавершённые типом победы**. Свёрнутые голосованием (Скрап) и брошенные не считаются\n(правила владельца + правило зачёта партий). Победа по времени — тоже\nтип победы и по коду правила засчитывается.\n\n**Счёт** (важен для победы по времени) [К2]: чудо 25, верование своей религии 20, будущая\nтехнология 10, город 8, житель 4, технология 4, политика 4, великое произведение 4.\n\n---\n\n## Что не проверено\n\n1. **Ничего не замерено в живой партии.** Все числа — из кода движка, собранной базы и карточки\n   [К], которая сама имеет статус `partial`. Первая проверка: равные юниты должны наносить\n   ровно 29 урона.\n2. Карточка [К] сверялась с базой от 2026-10-03; запросы [Б] этого гайда шли к базе,\n   собранной 2026-10-19 21:41. Если после этого правили данные мода, числа могли сдвинуться.\n3. **Цена политики**: формула прочитана в коде, таблица посчитана вручную; в игре не сверялась.\n   Не проверены скидки (Представительство и т.п.) и точное округление.\n4. **Источники счастья** перечислены по базе, но полный список (политики, верования, черты,\n   чудеса, наши признаки вроде `NOVA_POLICY_BUILDING_HAPPINESS_GLOBAL`) не разбирался.\n   Недовольство от идеологии — формула не вскрыта.\n5. **Содержание юнитов**: число бесплатных юнитов и итоговые суммы не посчитаны.\n6. **ЗОК**: правило взято из ванили; что меняет признак `FIX_DOMAIN_SEA_ZOC` — не разбирал.\n7. **Опыт до повышений** (10/30/60…) — ваниль, не сверено. Признак `HALF_EXP_FROM_FIGHT_AGAINST_AI`\n   включён, но не разбирался.\n8. **Победы**: условия Доминирования, Дипломатической и порог «влиятельности» для Культурной —\n   ваниль, в коде мода не проверены. 330 ходов на Быстрой — сумма из `GameSpeed_Turns`,\n   не замер.\n9. **Улучшения**: выдачи на особой местности (холм, лес, пресная вода у не-ферм), время\n   постройки и требования технологий — не сверялись. Сравнение с ванилью сделано только по\n   `CIV5Improvements.xml` из Expansion2.\n10. **Пророки на Быстрой** (≈200/200/335…) — расчёт по коду, округление в игре может отличаться\n    на единицы.\n11. Подсказки интерфейса (Lua) могут показывать числа иначе, чем считает движок, — интерфейс\n    не смотрели.\n12. В карточке [К] есть места, похожие на дефекты (например, +100% к очкам великих людей в\n    золотой век не применяется; наука от ГГ: комментарий в коде говорит 0, в базе 15) —\n    в гайд они не вынесены как правила.\n"};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const DOCS = { gaid: "gaid-novichka-chernovik.md", ahilles: "ahilles-patterny.md", mehaniki: "osnovy-mehanik.md" };
const BY_FILE = Object.fromEntries(Object.entries(DOCS).map(([k, v]) => [v, k]));
const cache = {};
const docEl = document.getElementById("doc");

async function show(key, push) {
  if (!DOCS[key]) key = "gaid";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.doc === key)));
  try {
    if (!cache[key]) {
      cache[key] = marked.parse(EMBED[key]);
    }
    docEl.innerHTML = cache[key];
    docEl.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tw"; t.replaceWith(w); w.appendChild(t); });
    docEl.querySelectorAll("a[href]").forEach(a => {
      const f = a.getAttribute("href");
      if (BY_FILE[f]) { a.href = "#" + BY_FILE[f]; a.addEventListener("click", e => { e.preventDefault(); show(BY_FILE[f], true); }); }
    });
  } catch (e) {
    docEl.innerHTML = '<p class="status">Не удалось загрузить раздел. Обновите страницу.</p>';
  }
  if (push) { try { history.replaceState(null, "", "#" + key); } catch (e) {} window.scrollTo(0, 0); }
  try { localStorage.setItem("nova-guide-tab", key); } catch (e) {}
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => show(t.dataset.doc, true)));
let start = location.hash.slice(1);
if (!DOCS[start]) { try { start = localStorage.getItem("nova-guide-tab") || "gaid"; } catch (e) { start = "gaid"; } }
show(start, false);
</script>
